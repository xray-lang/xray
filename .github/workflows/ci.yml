name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# A superseded PR run is spending a runner on an answer nobody will read. The
# suite is long enough that without this, pushes queue behind their own
# predecessors.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Everything named here is skipped on PR CI. Adding a name is a decision to
  # stop testing something, so it needs a reason recorded next to it.
  #
  # The cross-backend differential lanes (backend_diff, backend_diff_optimized,
  # backend_diff_deterministic, task190_*_backend_diff) are deliberately NOT in
  # these lists. They are the project's only check that one .xr program means
  # the same thing under the VM and under AOT, which for a two-backend language
  # is the correctness net; excluding them left it running only in a nightly
  # lane marked continue-on-error, i.e. not running at all.
  XRAY_CI_RELEASE09_EXTRA_EXCLUDE_RE: '^(test_vm_exception|sys_thread_vm|stdlib_embedded_layout|parallel_plan_vm_scaling_gate|http_static_route_full_parse|test_stdlib_boundary_manifest|stdlib_migration_contracts|stdlib_self_hosting_consistency|binary_stdlib_surface_inventory|binary_public_native_readiness|query_surface_residue|string_surface_residue|byte_array_aot_c90_hotpath|aot_freestanding_allowlist|aot_freestanding_provider_abi|aot_manifest_sweep|aot_isolate_symbol_gate|install_public_surface)$'
  # aot_filetests was removed from this list on 2026-07-30: it is the only driver
  # for the 104 `xray verify` contract cases and it now gates every passing case
  # against tests/aot/filetests_known_failures.txt (a shrink-only ratchet).
  #
  # backend_diff / task190_extern_backend_diff / backend_diff_deterministic were
  # removed on 2026-07-31 for the same reason: they now gate all 471 passing
  # differential cases against tests/diff/known_failures.txt. Excluding the
  # whole net because 13 cases were red meant PR CI ran zero VM/AOT comparisons
  # on a two-backend language.
  XRAY_CI_CORE_CTEST_EXCLUDE_RE: '^(test_vm_exception|aot_link_command_manifest|sys_thread_vm|stdlib_embedded_layout|parallel_plan_vm_scaling_gate|http_static_route_full_parse|test_stdlib_boundary_manifest|stdlib_migration_contracts|stdlib_self_hosting_consistency|binary_stdlib_surface_inventory|binary_public_native_readiness|query_surface_residue|string_surface_residue|byte_array_aot_c90_hotpath|aot_freestanding_allowlist|aot_freestanding_provider_abi|aot_manifest_sweep|aot_isolate_symbol_gate|install_public_surface|test_compress_native_error_abi|test_crypto_native_error_abi)$'

jobs:
  # ===========================================================================
  # Architecture lint (Phase 3, X-01 / C-01 / C-02)
  # Fast grep-only check that catches frontend boundary violations
  # before we spend a build-budget. See scripts/check_frontend_arch.sh
  # for the rule list.
  # ===========================================================================
  arch-lint:
    runs-on: ubuntu-latest
    name: Frontend Architecture Lint
    steps:
    - uses: actions/checkout@v4

    - name: Run frontend architecture lint
      run: |
        chmod +x ./scripts/check_frontend_arch.sh
        ./scripts/check_frontend_arch.sh

    # Text-only rules (R1 generated spec registry, R2 no undefined symbol in
    # normative prose). The R3 probe suite needs a compiler and runs as the
    # builtin_symbol_registry ctest instead.
    - name: Check built-in symbol registry
      run: python3 ./scripts/check_builtin_symbol_registry.py --root .

  # ===========================================================================
  # Reverse-invariant seed checks.
  #   - known_failures.txt freshness: every active suppression entry must
  #     carry ISSUE / ADDED <= 30 days / OWNER
  #   - DEFENSIVE-TEMP reconciliation: every src/ tag matches a docs row
  # ===========================================================================
  reverse-invariants:
    runs-on: ubuntu-latest
    name: Reverse-Invariant Seed Checks
    steps:
    - uses: actions/checkout@v4

    - name: known_failures.txt freshness (<= 30 days)
      run: |
        chmod +x ./scripts/check_known_failures_freshness.sh
        ./scripts/check_known_failures_freshness.sh

    - name: DEFENSIVE-TEMP reconciliation (tag <-> docs table)
      # Two-way reconciliation between every `DEFENSIVE-TEMP[NNN]` tag
      # in src/ and the table in docs/known_temp_workarounds.md. A tag
      # without a row, or a row without a tag, blocks merge — so removing
      # a workaround forces same-commit removal of both artifacts.
      run: |
        chmod +x ./scripts/check_temp_workarounds.sh
        ./scripts/check_temp_workarounds.sh

    - name: stdlib public surface uniqueness
      # Task 151 R3: each low-level semantic helper should have one canonical
      # public surface. The checker allows only explicitly recorded legacy debt.
      run: python3 ./scripts/check_stdlib_surface_uniqueness.py --root .

    - name: narrowing rules (spec <-> tests <-> analyzer)
      # Narrowing decides the type lowering sees, so a rule without an
      # implementation or without a conformance test is a VM/AOT divergence
      # risk. Three-way reconciliation blocks merge on either gap.
      run: |
        chmod +x ./scripts/check_narrowing_rules.sh
        ./scripts/check_narrowing_rules.sh

  # ===========================================================================
  # Build & Test (multi-platform)
  # ===========================================================================
  build:
    needs: arch-lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-2022
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
    - uses: actions/checkout@v4

    - name: Install zlib (Windows)
      if: runner.os == 'Windows'
      # zlib is a hard requirement for stdlib/compress, stdlib/http and
      # stdlib/ws. macOS/Linux runners ship it via the system; on
      # Windows we provision it through vcpkg so find_package(ZLIB)
      # succeeds and compress_zlib.c gets compiled in.
      shell: pwsh
      run: |
        vcpkg install zlib:x64-windows-release
        echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        echo "VCPKG_TARGET_TRIPLET=x64-windows-release" >> $env:GITHUB_ENV

    # Ninja is the project's one build generator on every platform.
    # On Windows that means cl.exe must be on PATH, which this action provides;
    # Ninja is preinstalled on all GitHub runner images.
    - name: Set up MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure (Unix)
      if: runner.os != 'Windows'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE" -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET"

    # Ninja is single-config: the build type comes from configure, and binaries
    # land directly in build/ on every platform (no Release/ subdirectory).
    - name: Build
      run: cmake --build build

    - name: Verify binary
      if: runner.os != 'Windows'
      run: ./build/xray --version

    - name: Verify binary (Windows)
      if: runner.os == 'Windows'
      run: .\build\xray.exe --version

    - name: Release Smoke (Unix)
      if: runner.os != 'Windows'
      run: ./build/xray test -q tests/regression/01_literals/0100_int_basic.xr

    # Windows regression tests (if script supports it)
    # - name: Regression Tests (Windows)
    #   if: runner.os == 'Windows'
    #   run: ...

  # ===========================================================================
  # Unit Tests (ctest, Debug mode)
  # Runs the full unit-test suite under tests/unit/. Debug mode is used because:
  #   - assertions are active (Release strips DCHECK)
  #   - matches the local development build mode used by the project
  # Both Linux x86_64 and macOS ARM64 are exercised so platform-specific
  # issues surface; the dev host is Apple Silicon ARM64.
  # ===========================================================================
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: macos-latest
            name: macOS ARM64

    runs-on: ${{ matrix.os }}
    name: Unit Tests (${{ matrix.name }})

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # aot_filetests runs in this job and 14 of its cases build for a foreign
    # target. Without a cross toolchain the runner skips them by name and the
    # suite still passes, but that coverage would then exist in no blocking job.
    - name: Install Zig
      run: |
        ./scripts/install_zig_toolchain.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Cache compiler objects
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ccache
          ~/Library/Caches/ccache
          .cache/xray-test
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Install ccache
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; else sudo apt-get update && sudo apt-get install -y ccache; fi
        ccache --max-size=2G

    - name: Configure (Debug)
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build build --parallel 4

    - name: Run local 0.9 consolidation gate
      run: |
        export XRAY_RELEASE09_EXTRA_EXCLUDE_RE="$XRAY_CI_RELEASE09_EXTRA_EXCLUDE_RE"
        ./scripts/run_release_09_gate.sh --no-build --skip-boundary-report

  # ===========================================================================
  # Static Analysis (clang-tidy)
  # ===========================================================================
  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (clang-tidy)

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-tidy
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy-14

    - name: Generate compile_commands.json
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Run clang-tidy on core modules
      run: |
        # Run clang-tidy on critical modules (lexer, parser, vm, memory)
        # Using find + xargs for parallel execution
        find src/frontend src/vm src/runtime/mem src/runtime/value src/runtime/object \
          -name '*.c' ! -name '*.inc.c' -type f | \
        xargs -P$(nproc) -I{} \
          clang-tidy-14 -p build {} \
          2>&1 | tee clang-tidy-output.txt

        # Check for errors (warnings are allowed, errors fail the build)
        if grep -q "error:" clang-tidy-output.txt; then
          echo "clang-tidy found errors!"
          exit 1
        fi
        echo "clang-tidy passed (warnings may exist but no errors)"

    - name: Upload clang-tidy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-report
        path: clang-tidy-output.txt
        retention-days: 7

  # ===========================================================================
  # Sanitizer Tests (ASan + UBSan)
  # ===========================================================================
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: AddressSanitizer
            cmake_flag: ENABLE_ASAN
            short: asan
            informational: false
          - name: UndefinedBehaviorSanitizer
            cmake_flag: ENABLE_UBSAN
            short: ubsan
            informational: false
          - name: ThreadSanitizer
            cmake_flag: ENABLE_TSAN
            short: tsan
            informational: false

    runs-on: ubuntu-latest
    name: ${{ matrix.sanitizer.name }}${{ matrix.sanitizer.informational && ' (informational)' || '' }}
    continue-on-error: ${{ matrix.sanitizer.informational }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure with ${{ matrix.sanitizer.name }}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -D${{ matrix.sanitizer.cmake_flag }}=ON

    - name: Build
      run: cmake --build build -j$(nproc)
      env:
        # The sanitizer build runs stdlib bytecode/code generators before
        # tests. Keep leak cleanup as a separate debt item while still
        # catching address errors in those generated binaries.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1

    # See unit-tests job: test_vm_exception is a pre-existing failure
    # excluded from CI.
    - name: Run unit tests with ${{ matrix.sanitizer.name }}
      run: |
        cd build
        # No blanket --timeout: each test carries the TIMEOUT its shape needs
        # in CMakeLists.txt, and a flat 120s here silently overrode them. The
        # cross-backend differential lanes are minutes-long by construction.
        ctest --output-on-failure \
              --exclude-regex "$XRAY_CI_CORE_CTEST_EXCLUDE_RE"
      env:
        # Leak detection disabled: unit tests don't fully tear down
        # isolates/GC. Real memory errors (OOB, UAF) still abort.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    - name: Run release smoke with ${{ matrix.sanitizer.name }}
      run: ./build/xray test -q tests/regression/01_literals/0100_int_basic.xr
      env:
        XRAY_TEST_DUMP_FAILED: "1"
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:symbolize=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1

    # The ordinary sanitizer CTest surface above covers the C tests.  This
    # additional ASan-only step exercises a committed multi-module compiler
    # workload through the native AOT C-emission path.  The optional sibling
    # xxhash checkout is exercised by the same script in local/release gates.
    - name: Run Task 218 focused compiler workload
      if: matrix.sanitizer.short == 'asan'
      run: bash scripts/run_asan_focused.sh
      env:
        XR_ASAN_BUILD_DIR: build
        XR_ASAN_SKIP_BUILD: "1"
        XR_ASAN_CTEST_REGEX: "^$"
        XR_ASAN_DIFF_REGEX: "^$"

  # ===========================================================================
  # Freestanding QEMU Smoke
  # Keep the 0.9 mainline gate focused on the x86_64 multiboot smoke. The
  # RISC-V virt and Cortex-M MPS2 serial probes are broader portability
  # targets and remain outside the release-0.9 blocking CI surface.
  # ===========================================================================
  freestanding-qemu:
    runs-on: ubuntu-latest
    name: Freestanding QEMU Smoke
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Install QEMU and LLVM tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          curl \
          llvm \
          qemu-system-arm \
          qemu-system-misc \
          qemu-system-x86 \
          xz-utils

    - name: Install Zig
      run: |
        ./scripts/install_zig_toolchain.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run freestanding QEMU smokes
      working-directory: build
      run: >-
        ctest --output-on-failure --timeout 120
        -R '^aot_freestanding_qemu_smoke$'
      env:
        XRAY_FREESTANDING_QEMU_REQUIRED: "1"

  # ===========================================================================
  # Code Coverage Report
  # ===========================================================================
  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage

    steps:
    - uses: actions/checkout@v4

    - name: Install lcov
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Configure with coverage
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_COVERAGE=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    # See unit-tests job: test_vm_exception is a pre-existing failure
    # excluded from CI.
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure \
              --exclude-regex "$XRAY_CI_CORE_CTEST_EXCLUDE_RE"

    - name: Run release smoke
      run: ./build/xray test -q tests/regression/01_literals/0100_int_basic.xr

    - name: Generate coverage report
      run: |
        # Capture coverage data.  --ignore-errors negative works around
        # gcov race-condition counters that occasionally go below zero.
        lcov --capture --directory build --output-file coverage.info \
          --ignore-errors negative,mismatch

        # Remove system headers and test files
        lcov --remove coverage.info \
          '/usr/*' \
          '*/tests/*' \
          '*/stdlib/*' \
          --output-file coverage.info \
          --ignore-errors negative,mismatch

        # Generate summary
        lcov --list coverage.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: coverage.info
        fail_ci_if_error: false
        verbose: true

    - name: Generate HTML report
      run: |
        genhtml coverage.info --output-directory coverage-report

    - name: Upload HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/
        retention-days: 7

  # ===========================================================================
  # Code Format Check
  # ===========================================================================
  format-check:
    runs-on: ubuntu-latest
    name: Code Format Check

    steps:
    - uses: actions/checkout@v4

    - name: Check whitespace hygiene
      run: |
        if git grep -n -I -E '[[:blank:]]$' -- src include stdlib; then
          echo "Trailing whitespace found."
          exit 1
        fi
        echo "Whitespace hygiene check passed"
