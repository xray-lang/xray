name: Array x64 boundary probe

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  x64-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: current-ubuntu-24.04-940e171bbcfa9052e0c5d4fce0c82d6da8979c63
          path: ci-artifact
          run-id: 44726072579
          github-token: ${{ github.token }}
      - name: Compare the Array boundary variants
        run: python3 .github/scripts/task345_x64_boundary_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task345-array-x64-boundary
          path: probe-results/
