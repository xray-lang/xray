name: macOS native Array append comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-layout:
    name: macOS arm64 native Array append (${{ matrix.replica }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      XR_ARRAY_PARENT: f946163a5724606906b2324d27fe3900e6e2b48a
      XR_ARRAY_CANDIDATE: 915e731ca6ecd90e6099f4a033b37613207082b1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare both exact sources with the same Apple Clang
        run: |
          test "$(uname -m)" = arm64
          test "$(git diff --name-only "$XR_ARRAY_PARENT" "$XR_ARRAY_CANDIDATE")" = bench/managed-value-layout/layout.h
          mkdir "$RUNNER_TEMP/code-receipts"
          uname -a > "$RUNNER_TEMP/code-receipts/host.txt"
          clang="$(command -v clang)"
          for variant in parent candidate; do
            source="$XR_ARRAY_PARENT"
            if [ "$variant" = candidate ]; then source="$XR_ARRAY_CANDIDATE"; fi
            git worktree add --detach "$RUNNER_TEMP/$variant-src" "$source"
            test "$(git -C "$RUNNER_TEMP/$variant-src" rev-parse HEAD)" = "$source"
            python "$RUNNER_TEMP/$variant-src/bench/managed-value-layout/run.py" prepare \
              --cc "$clang" --work "$RUNNER_TEMP/$variant-build"
            for product in managed raw; do
              binary="$RUNNER_TEMP/$variant-build/$product"
              file "$binary" >> "$RUNNER_TEMP/code-receipts/architectures.txt"
              otool -tvV "$binary" > "$RUNNER_TEMP/code-receipts/$variant-$product-disassembly.txt"
            done
          done
      - name: Alternate the original native Array append workload on this host
        run: |
          python scripts/diagnostics/compare_macos_array_layout.py \
            --parent "$RUNNER_TEMP/parent-build/prepared.json" \
            --candidate "$RUNNER_TEMP/candidate-build/prepared.json" \
            --case push --work "$RUNNER_TEMP/layout-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-native-append-macos-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/parent-build/
            ${{ runner.temp }}/candidate-build/
            ${{ runner.temp }}/code-receipts/
            ${{ runner.temp }}/layout-results/
