name: macOS Array VM comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-array-vm:
    name: macOS arm64 Array VM comparison (${{ matrix.alignment }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alignment: [16, 32, 64]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      XR_ARRAY_PARENT: 874d23f314e4019b55c60e64f215a3961b7275c5
      XR_ARRAY_CANDIDATE: fcab5af91db976110d7183e05b2cfdad829b4e0b
      XR_ALIGNMENT: ${{ matrix.alignment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build both exact sources with the same Clang configuration
        run: |
          mkdir "$RUNNER_TEMP/build-receipts"
          for variant in parent candidate; do
            source="$XR_ARRAY_PARENT"
            if [ "$variant" = candidate ]; then source="$XR_ARRAY_CANDIDATE"; fi
            git worktree add --detach "$RUNNER_TEMP/$variant-src" "$source"
            cmake -S "$RUNNER_TEMP/$variant-src" -B "$RUNNER_TEMP/$variant-build" -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_C_FLAGS=-falign-functions=$XR_ALIGNMENT" \
              "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG" \
              > "$RUNNER_TEMP/build-receipts/$variant-configure.txt" 2>&1
            cmake --build "$RUNNER_TEMP/$variant-build" --target xray --parallel 4 \
              > "$RUNNER_TEMP/build-receipts/$variant-build.txt" 2>&1
            cp "$RUNNER_TEMP/$variant-build/CMakeCache.txt" "$RUNNER_TEMP/build-receipts/$variant-cache.txt"
          done
      - name: Alternate the real Array workload and scalar controls
        run: |
          python scripts/diagnostics/compare_macos_array_vm.py \
            --root "$RUNNER_TEMP/parent-src" --root "$RUNNER_TEMP/candidate-src" \
            --binary "$RUNNER_TEMP/parent-build/xray" --binary "$RUNNER_TEMP/candidate-build/xray" \
            --commit "$XR_ARRAY_PARENT" --commit "$XR_ARRAY_CANDIDATE" --alignment "$XR_ALIGNMENT" \
            --work "$RUNNER_TEMP/array-vm-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-vm-comparison-macos-${{ matrix.alignment }}
          path: |
            ${{ runner.temp }}/build-receipts/
            ${{ runner.temp }}/array-vm-results/
