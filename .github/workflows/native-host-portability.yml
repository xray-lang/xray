name: Native host portability

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, agent/host-arch-portability, agent/direct-cutover]
  workflow_dispatch:
    inputs:
      scalar_performance:
        description: Run macOS scalar performance across three declared alignments
        type: boolean
        default: false

jobs:
  current:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: native-host-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Native Windows (MSVC x64)
          - os: macos-latest
            name: Native macOS (Ninja Release)
          - os: ubuntu-24.04
            name: Native Linux (ubuntu-24.04)
          - os: ubuntu-24.04-arm
            name: Native Linux (ubuntu-24.04-arm)
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      VSLANG: '1033'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Cache Unix compiler objects
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xray-ccache
          key: target-compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            target-compiler-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Unix compiler cache
        if: runner.os != 'Windows'
        env:
          CCACHE_DIR: ${{ runner.temp }}/xray-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$CCACHE_BASEDIR" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ccache
          else
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=2G
      - name: Configure Windows Ninja Release
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/configure.log -- cmake --preset default
      - name: Configure Unix Ninja Release
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/configure.log -- cmake --preset default
      - name: Build Windows all without exclusions
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/build-all.log -- cmake --build build --parallel 4 --target all -- -k 0
      - name: Build Unix all without exclusions
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/build-all.log -- cmake --build build --parallel 4 --target all -- -k 0
      - name: Independently rebuild Windows CLI
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/cli-post-build.log -- cmake --build build --parallel 4 --target xray
      - name: Independently rebuild Unix CLI
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/cli-post-build.log -- cmake --build build --parallel 4 --target xray
      - name: Verify Windows current gates
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/verify_current_build.py --build build --evidence current-evidence
      - name: Verify Unix current gates
        if: runner.os != 'Windows'
        run: python scripts/verify_current_build.py --build build --evidence current-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-${{ matrix.os }}-${{ github.sha }}
          path: |
            current-evidence/
            build/Testing/Temporary/LastTest.log
            build/smoke/
            build/CMakeCache.txt

  scalar-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.scalar_performance
    name: Scalar macOS (alignment ${{ matrix.alignment }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alignment: [16, 32, 64]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure matched Clang Release
        run: >-
          python scripts/ci_build_log.py --log build/scalar-configure.log --
          cmake --preset default
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS=-falign-functions=${{ matrix.alignment }}
          "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG"
      - name: Build scalar execution targets
        run: >-
          python scripts/ci_build_log.py --log build/scalar-build.log --
          cmake --build build --parallel 4 --target xray lir_vm_run xray_native_runtime
      - name: Build pinned Lua with matched optimization and dispatch
        run: |
          git init "$RUNNER_TEMP/scalar-lua"
          git -C "$RUNNER_TEMP/scalar-lua" fetch --depth=1 https://github.com/lua/lua.git 7579fc9d7ed90240487251dfb69168f8e64e9294
          git -C "$RUNNER_TEMP/scalar-lua" checkout --detach FETCH_HEAD
          clang -std=c11 -O2 -DNDEBUG -ffp-contract=off -falign-functions=${{ matrix.alignment }} \
            -DLUA_USE_POSIX -DLUA_USE_DLOPEN -DLUA_USE_JUMPTABLE=1 \
            "$RUNNER_TEMP/scalar-lua/onelua.c" -o "$RUNNER_TEMP/scalar-lua/lua"
      - name: Measure public CLI, C and Lua
        run: >-
          python scripts/run_scalar_performance.py --root . --build build
          --work build/scalar-performance --samples 9 --cc /usr/bin/clang
          --alignment ${{ matrix.alignment }} --lua "$RUNNER_TEMP/scalar-lua/lua"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-macos-${{ matrix.alignment }}-${{ github.sha }}
          path: |
            build/scalar-*
            build/CMakeCache.txt
            build/compile_commands.json
