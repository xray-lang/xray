name: macOS standalone Array value length comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-layout:
    name: macOS arm64 Array value length (${{ matrix.replica }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      XR_ARRAY_PARENT: 5f3304be7a393581bc050a941bd3d1d8b7540e4d
      XR_ARRAY_CANDIDATE: b3ea23fdb0652922b4350f3abc4348b4af1f8bdf
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare both exact sources with the same Apple Clang
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse "$XR_ARRAY_CANDIDATE^")" = "$XR_ARRAY_PARENT"
          git diff --exit-code "$XR_ARRAY_PARENT" "$XR_ARRAY_CANDIDATE" -- src/base/xsigned_rc.h \
            bench/managed-value-layout/raw.c \
            bench/managed-value-layout/raw_keys.c bench/managed-value-layout/algorithms.h \
            bench/managed-value-layout/run.py
          mkdir "$RUNNER_TEMP/code-receipts"
          uname -a > "$RUNNER_TEMP/code-receipts/host.txt"
          clang="$(command -v clang)"
          for variant in parent candidate; do
            source="$XR_ARRAY_PARENT"
            if [ "$variant" = candidate ]; then source="$XR_ARRAY_CANDIDATE"; fi
            git worktree add --detach "$RUNNER_TEMP/$variant-src" "$source"
            test "$(git -C "$RUNNER_TEMP/$variant-src" rev-parse HEAD)" = "$source"
            python "$RUNNER_TEMP/$variant-src/bench/managed-value-layout/run.py" prepare \
              --cc "$clang" --work "$RUNNER_TEMP/$variant-build"
            for product in managed raw; do
              binary="$RUNNER_TEMP/$variant-build/$product"
              file "$binary" >> "$RUNNER_TEMP/code-receipts/architectures.txt"
              otool -tvV "$binary" > "$RUNNER_TEMP/code-receipts/$variant-$product-disassembly.txt"
            done
            raw="$RUNNER_TEMP/code-receipts/$variant-raw-text"
            otool -s __TEXT __text "$RUNNER_TEMP/$variant-build/raw" > "$raw.txt"
            awk 'NR > 2 {for (i = 2; i <= NF; ++i) printf "%s", $i}' "$raw.txt" > "$raw.hex"
            test -s "$raw.hex"
          done
          cmp "$RUNNER_TEMP/code-receipts/parent-raw-text.hex" "$RUNNER_TEMP/code-receipts/candidate-raw-text.hex"
      - name: Alternate the original native Array append workload on this host
        run: |
          python scripts/diagnostics/compare_macos_array_layout.py \
            --parent "$RUNNER_TEMP/parent-build/prepared.json" \
            --candidate "$RUNNER_TEMP/candidate-build/prepared.json" \
            --case push --work "$RUNNER_TEMP/layout-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: array-value-length-macos-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/parent-build/
            ${{ runner.temp }}/candidate-build/
            ${{ runner.temp }}/code-receipts/
            ${{ runner.temp }}/layout-results/
