name: Native host portability

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, agent/host-arch-portability, agent/direct-cutover]
  workflow_dispatch:
    inputs:
      scalar_performance:
        description: Run macOS scalar performance across three declared alignments
        type: boolean
        default: false
      native_sanitizers:
        description: Include focused macOS native sanitizer checks
        type: boolean
        default: false
      baseline_comparison:
        description: Include the earlier compiler on each scalar runner
        type: boolean
        default: false
      native_cpu_diagnostics:
        description: Record layout16 fib CPU phases with current native objects
        type: boolean
        default: false

jobs:
  current:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: native-host-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/agent/direct-cutover' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Native Windows (MSVC x64)
          - os: macos-latest
            name: Native macOS (Ninja Release)
          - os: ubuntu-24.04
            name: Native Linux (ubuntu-24.04)
          - os: ubuntu-24.04-arm
            name: Native Linux (ubuntu-24.04-arm)
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
      VSLANG: '1033'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Cache Unix compiler objects
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xray-ccache
          key: target-compiler-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            target-compiler-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare Unix compiler cache
        if: runner.os != 'Windows'
        env:
          CCACHE_DIR: ${{ runner.temp }}/xray-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$CCACHE_BASEDIR" >> "$GITHUB_ENV"
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=2G
          elif command -v sccache >/dev/null 2>&1; then
            sccache --version
          else
            echo "Compiler cache unavailable. Compiling directly."
          fi
      - name: Configure Windows Ninja Release
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/configure.log -- cmake --preset default
      - name: Configure Unix Ninja Release
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/configure.log -- cmake --preset default
      - name: Build Windows all without exclusions
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/build-all.log -- cmake --build build --parallel 4 --target all -- -k 0
      - name: Build Unix all without exclusions
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/build-all.log -- cmake --build build --parallel 4 --target all -- -k 0
      - name: Independently rebuild Windows CLI
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/ci_build_log.py --log current-evidence/cli-post-build.log -- cmake --build build --parallel 4 --target xray
      - name: Independently rebuild Unix CLI
        if: runner.os != 'Windows'
        run: python scripts/ci_build_log.py --log current-evidence/cli-post-build.log -- cmake --build build --parallel 4 --target xray
      - name: Verify Windows current gates
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          chcp 65001 >nul
          python scripts/verify_current_build.py --build build --evidence current-evidence
      - name: Verify Unix current gates
        if: runner.os != 'Windows'
        run: python scripts/verify_current_build.py --build build --evidence current-evidence
      - name: Verify Unix pipe closure with unread bytes
        if: runner.os != 'Windows'
        run: >-
          python scripts/ci_build_log.py --log current-evidence/pipe-probe.log --
          ctest --test-dir build --output-on-failure --no-tests=error -R '^os_pipe_owned$'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-${{ matrix.os }}-${{ github.sha }}
          path: |
            current-evidence/
            build/Testing/Temporary/LastTest.log
            build/smoke/
            build/CMakeCache.txt
            build/lir-cli-commands/**/result.json
            build/lir-cli-commands/**/*.stdout
            build/lir-cli-commands/**/*.stderr
            build/lir-cli-array-native/**/result.json
            build/lir-cli-array-native/**/*.stdout
            build/lir-cli-array-native/**/*.stderr

  scalar-performance:
    if: github.event_name == 'workflow_dispatch' && inputs.scalar_performance
    name: Scalar macOS (alignment ${{ matrix.alignment }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        alignment: [16, 32, 64]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure matched Clang Release
        run: >-
          python scripts/ci_build_log.py --log build/scalar-configure.log --
          cmake --preset default
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS=-falign-functions=${{ matrix.alignment }}
          "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG"
      - name: Build scalar execution targets
        run: >-
          python scripts/ci_build_log.py --log build/scalar-build.log --
          cmake --build build --parallel 4 --target xray lir_vm_run xray_native_runtime
      - name: Build pinned Lua with matched optimization and dispatch
        run: |
          git init "$RUNNER_TEMP/scalar-lua"
          git -C "$RUNNER_TEMP/scalar-lua" fetch --depth=1 https://github.com/lua/lua.git 7579fc9d7ed90240487251dfb69168f8e64e9294
          git -C "$RUNNER_TEMP/scalar-lua" checkout --detach FETCH_HEAD
          clang -std=c11 -O2 -DNDEBUG -ffp-contract=off -falign-functions=${{ matrix.alignment }} \
            -DLUA_USE_POSIX -DLUA_USE_DLOPEN -DLUA_USE_JUMPTABLE=1 \
            "$RUNNER_TEMP/scalar-lua/onelua.c" -o "$RUNNER_TEMP/scalar-lua/lua"
      - name: Measure public CLI, C and Lua
        id: measure
        run: >-
          python scripts/run_scalar_performance.py --root . --build build
          --work build/scalar-performance --samples 9 --cc /usr/bin/clang
          --alignment ${{ matrix.alignment }} --lua "$RUNNER_TEMP/scalar-lua/lua"
      - name: Observe the previous CLI on the same runner
        if: always() && inputs.baseline_comparison && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure')
        continue-on-error: true
        run: |
          git fetch --depth=1 origin 395d6246fc90b8ce384c25874e513a7418359386
          git worktree add --detach "$RUNNER_TEMP/scalar-before" FETCH_HEAD
          python scripts/ci_build_log.py --log build/scalar-before-configure.log -- \
            cmake -S "$RUNNER_TEMP/scalar-before" -B "$RUNNER_TEMP/scalar-before-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS=-falign-functions=${{ matrix.alignment }} "-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG"
          python scripts/ci_build_log.py --log build/scalar-before-build.log -- \
            cmake --build "$RUNNER_TEMP/scalar-before-build" --parallel 4 --target xray lir_vm_run xray_native_runtime
          python scripts/run_scalar_performance.py --root "$RUNNER_TEMP/scalar-before" \
            --build "$RUNNER_TEMP/scalar-before-build" --work build/scalar-before-performance \
            --samples 9 --cc /usr/bin/clang --alignment ${{ matrix.alignment }} --lua "$RUNNER_TEMP/scalar-lua/lua"
      - name: Diagnose runtime and loop CPU phases
        if: always() && !cancelled() && inputs.native_cpu_diagnostics && matrix.alignment == 16 && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure')
        run: |
          python -B scripts/diagnostics/native_loop_phase.py --root . \
            --product-ref "$GITHUB_SHA" --workload fib \
            --build build --baseline build/scalar-performance/result.json \
            --output build/scalar-phase-diagnostic --cc /usr/bin/clang \
            --alignment ${{ matrix.alignment }} --objdump "$(xcrun --find otool)"
      - name: Build focused native sanitizers
        if: always() && inputs.native_sanitizers && matrix.alignment == 16
        run: |
          python scripts/ci_build_log.py --log build/scalar-san-configure.log -- \
            cmake -S . -B build-native-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DXR_XIR_PARANOID=ON
          python scripts/ci_build_log.py --log build/scalar-san-build.log -- \
            cmake --build build-native-san --parallel 4 --target xray xray_native_runtime
      - name: Verify sanitized public native output
        if: always() && inputs.native_sanitizers && matrix.alignment == 16
        env:
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess
          root = Path.cwd()
          work = root / 'build/scalar-native-sanitizers'
          work.mkdir()
          binary = root / 'build-native-san/xray'
          env = dict(os.environ, XRAY_STDLIB_PATH=str(root / 'stdlib'), NO_COLOR='1')
          records = []
          def run(name, command, code):
              child = subprocess.run(list(map(str, command)), capture_output=True, env=env, timeout=30)
              streams = {}
              for stream, data in (('stdout', child.stdout), ('stderr', child.stderr)):
                  path = work / (name + '.' + stream)
                  path.write_bytes(data)
                  streams[stream] = hashlib.sha256(data).hexdigest()
              records.append(dict(name=name, command=list(map(str, command)), exit=child.returncode, streams=streams))
              (work / 'result.json').write_text(json.dumps(records, indent=2) + '\n')
              assert child.returncode == code, (name, child.returncode, child.stderr)
              return child
          for name, wanted in (('hello', b'42\n'), ('unicode', '你好\n'.encode()),
                               ('f64', b'3.75\n'), ('module_scalar_constants', b'1\n'), ('panic', None)):
              source = root / 'tests/fixtures/lir_cli' / (name + '.xr')
              vm = run(name + '-vm', [binary, 'run', source], 1 if wanted is None else 0)
              if wanted is not None:
                  assert vm.stdout == wanted and not vm.stderr
              output = work / name
              run(name + '-build', [binary, 'build', source, '-o', output], 0)
              native = run(name + '-native', [output], vm.returncode)
              assert (native.stdout, native.stderr) == (vm.stdout, vm.stderr), name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-macos-${{ matrix.alignment }}-${{ github.sha }}
          path: |
            build/scalar-*
            build/CMakeCache.txt
            build/compile_commands.json

  msvc-generated-c:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    name: MSVC generated C11
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Configure compiler
      run: cmake --preset default
    - name: Build compiler and numeric regression
      run: cmake --build build --target xray test_bits_wide_c11 --parallel 4
    - name: Compile real generated C under MSVC
      run: ctest --test-dir build/tests/unit/shared/bits_wide --output-on-failure

  arch-lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    runs-on: ubuntu-latest
    name: Frontend Architecture Lint
    steps:
    - uses: actions/checkout@v4

    - name: Run frontend architecture lint
      run: |
        python3 ./scripts/check_frontend_arch.py


  xraytest-floor:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    runs-on: ubuntu-latest
    name: Shared Test Runtime (Python floor)
    steps:
    - uses: actions/checkout@v4

    - name: Read the declared floor
      id: floor
      run: |
        version=$(sed -n 's/^set(XRAY_PYTHON_MIN_VERSION "\([0-9.]*\)".*/\1/p' CMakeLists.txt)
        test -n "$version" || { echo "XRAY_PYTHON_MIN_VERSION not found in CMakeLists.txt" >&2; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Declared Python floor: $version"

    - name: Pin the supported build-host floor
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.floor.outputs.version }}

    - name: xraytest unit tests
      run: |
        python3 --version
        cd tests/lib/tests
        python3 -m unittest discover -s . -p 'test_*.py' -v

  sanitizers:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    name: Current gates (ASan + UBSan + paranoid)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure combined sanitizers
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DXR_XIR_PARANOID=ON
      - name: Build current products and kernels
        run: cmake --build build --parallel 4 --target all -- -k 0
      - name: Verify exact CLI and current gates
        run: python scripts/verify_current_build.py --build build --evidence sanitizer-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-sanitizers-${{ github.sha }}
          path: |
            sanitizer-evidence
            build/CMakeCache.txt
            build/compile_commands.json
            build/Testing/Temporary

  thread-sanitizer:
    if: github.event_name != 'workflow_dispatch' || !inputs.scalar_performance
    name: Thread kernels (TSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure thread instrumentation
        run: >-
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DENABLE_TSAN=ON -DXR_XIR_PARANOID=ON
      - name: Build thread kernels
        run: cmake --build build-tsan --parallel 4 --target test_os_thread_token test_xir_values test_xir_value_allocations
      - name: Run thread kernels
        run: |
          ctest --test-dir build-tsan --output-on-failure --no-tests=error -R '^os_thread_token$'
          ctest --test-dir build-tsan --output-on-failure --no-tests=error -R '^test_xir_values$'
          timeout 60s ./build-tsan/tests/unit/test_xir_value_allocations --closed-threads > build-tsan/closed-threads.stdout 2> build-tsan/closed-threads.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thread-sanitizer-${{ github.sha }}
          path: |
            build-tsan/closed-threads.*
            build-tsan/CMakeCache.txt
            build-tsan/compile_commands.json
            build-tsan/Testing/Temporary
