name: Nightly

# Nightly runs cover slow / platform-specific configurations that
# would inflate PR latency if gated synchronously:
#   - mem-stress           : repeated memory-heavy regressions
#   - linux-msan          : MemorySanitizer (track-origins=2)
#   - windows-msvc-release: MSVC Release CRT with the four Win11
#                           coroutine scenarios that exposed
#                           STATUS_HEAP_CORRUPTION in May 2026
#   - fuzz-smoke          : short coverage-guided libFuzzer runs of the
#                           four tests/fuzz harnesses
#
# Nightly failures are actionable signals. The Linux MSan lane remains
# informational because GitHub-hosted Ubuntu runners do not provide an
# instrumented libc / libc++, which can produce cross-library false
# positives.

on:
  schedule:
    # 02:00 UTC daily == 10:00 Asia/Shanghai
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================================================
  # Full tiered suite (scripts/t.py t3)
  #
  # PR CI runs a bounded subset; t3 is the only lane that runs everything,
  # including the six toolchain-spawning tests that dominate the runtime
  # (aot_standalone_suite, asan_focused, and the four native-ABI suites). It is
  # blocking so that "nightly caught it" stays a real sentence — the existing
  # linux-msan lane is continue-on-error, which is why the differential net has
  # been able to sit red without anyone being told.
  # ===========================================================================
  full-suite:
    runs-on: ubuntu-latest
    name: Full Suite (t3)
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache compiler objects
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ccache
          .cache/xray-test
        key: nightly-ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          nightly-ccache-${{ runner.os }}-

    - name: Install toolchain
      run: |
        sudo apt-get update && sudo apt-get install -y ccache ninja-build
        ccache --max-size=5G
        python3 ./scripts/install_zig_toolchain.py
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

    - name: Run tier t3
      run: python3 ./scripts/t.py t3

    - name: ccache statistics
      if: always()
      run: ccache -s

  # ---------------------------------------------------------------------------
  # 1. Memory stress on Linux + macOS arm64
  # ---------------------------------------------------------------------------
  mem-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            short_name: linux
          - os: macos-latest
            short_name: macos-arm64

    runs-on: ${{ matrix.os }}
    name: Memory Stress (${{ matrix.short_name }})
    timeout-minutes: 30

    env:
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:symbolize=1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build
          echo "MALLOC_PERTURB_=205" >> $GITHUB_ENV

      - name: Enable MallocScribble (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "MallocScribble=1" >> $GITHUB_ENV
          echo "MallocPreScribble=1" >> $GITHUB_ENV
          echo "MallocGuardEdges=1" >> $GITHUB_ENV

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_ASAN=ON

      - name: Build
        run: cmake --build build -j

      - name: Run memory-heavy regression tests 10 times
        env:
          XRAY_BIN: ./build/xray
        # run_mem_stress.py selects the memory-heavy regression set (1205 /
        # 1206 / 1207). Failure tails for any crashed iteration land in
        # tests/tmp/mem_stress_failures.log which the artifact upload
        # below would pick up if added in a follow-up.
        run: |
          python3 ./scripts/run_mem_stress.py 10

  # ---------------------------------------------------------------------------
  # 2. Linux MSan
  # ---------------------------------------------------------------------------
  linux-msan:
    runs-on: ubuntu-latest
    name: MSan (Linux Clang)
    timeout-minutes: 60
    continue-on-error: true

    env:
      # halt_on_error=0 + exit_code=86 lets every uninit read in a single
      # test surface (instead of aborting on the first), and marks the
      # test as failed without taking the whole runner down. Mirrors the
      # PR matrix linux-msan slot in ci.yml.
      MSAN_OPTIONS: "halt_on_error=0:print_stats=1:abort_on_error=0:exit_code=86"
      # Dump per-test stdout/stderr (sanitizer trace) on failure so triage
      # does not need a local MSan build. Mirrors PR matrix in ci.yml.
      XRAY_TEST_DUMP_FAILED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build

      - name: Configure (MSan)
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_MSAN=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build -j

      - name: Run regression tests under MSan
        run: |
          python3 ./scripts/run_regression_tests.py
        env:
          XRAY_PATH: ./build/xray
          XRAY_BUILD_DIR: ./build

  # ---------------------------------------------------------------------------
  # 3. Windows MSVC Release + Win11 coroutine 4 cases
  # ---------------------------------------------------------------------------
  windows-msvc-release:
    runs-on: windows-2022
    name: MSVC Release + Win11 Coro
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install zlib
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows-release
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=x64-windows-release" >> $env:GITHUB_ENV

      # Ninja on every platform; on Windows that needs cl.exe on PATH.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Release)
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:CMAKE_TOOLCHAIN_FILE"
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET"

      # Ninja is single-config: no --config, and the binary lands in build/.
      - name: Build
        run: cmake --build build

      - name: Run Win11 coroutine 4 cases 5x
        shell: bash
        env:
          XRAY_BIN: ./build/xray.exe
        # repro_win11_coro_burn.py pins the same four cases that
        # exposed STATUS_HEAP_CORRUPTION in May 2026 (1115 cancel,
        # 1109 await_any, 1127 priority, 1128 yield) and writes
        # failure tails to tests/tmp/win11_coro_failures.log.
        run: |
          python3 ./scripts/repro_win11_coro_burn.py 5

  # ---------------------------------------------------------------------------
  # 4. libFuzzer smoke (lexer / parser / stdlib data / XTP decoder)
  #
  # The four harnesses in tests/fuzz have shipped with a documented build recipe
  # and a 45-file seed corpus for some time, and nothing has ever run them:
  # grepping .github/ for "fuzz" matched no workflow line before this job. Only
  # fuzz_xtp_decode had any automation at all, and only in its FUZZ_STANDALONE
  # shape -- tests/unit registers it as the ctest test_xtp_fuzz_entry, which
  # walks a fixed 26-entry mutation matrix and never invokes libFuzzer. The
  # coverage-guided form of all four is new here.
  #
  # This job depends on the global instrumentation that ENABLE_FUZZING now turns
  # on (see the ENABLE_FUZZING block in CMakeLists.txt). Previously the
  # -fsanitize=fuzzer flags reached only each harness's own glue while xray_core
  # was built clean, which measured as 10 coverage counters in fuzz_lexer and 12
  # in fuzz_parser -- an 11 MB executable with twelve counters. libFuzzer had no
  # gradient to follow and ASan could not see allocations inside the library, so
  # wiring these harnesses into CI ahead of that fix would have bought an
  # expensive green light rather than a test.
  #
  # What 60 seconds per harness proves: each harness still compiles and links
  # against current headers, and survives a large number of mutations of the
  # real corpus without tripping ASan or UBSan. What it does not prove: absence
  # of bugs. The run starts from the same 45 committed seeds every night and
  # keeps nothing between nights, so it re-explores one small neighbourhood
  # rather than deepening a corpus over time. Read a pass as a smoke signal.
  # Growing this into real fuzzing means persisting the corpus across runs
  # (cache or an external service such as OSS-Fuzz), not raising the timeout.
  # ---------------------------------------------------------------------------
  fuzz-smoke:
    runs-on: ubuntu-latest
    name: libFuzzer Smoke (Linux Clang)
    timeout-minutes: 60
    # Informational for now, deliberately and not permanently.
    #
    # fuzz_stdlib_data is known to fail on contact, and not on a mutation: it
    # segfaults while tearing down the VM on the committed seed corpus/
    # stdlib_data/00_csv_basic.txt, a 17-byte CSV. The read is of uninitialised
    # heap (0xbebe...) in xr_obj_destroy_array -> xr_coro_heap_sub_external
    # (xcoro_heap.h:346), reached from xray_vm_delete, and it reproduces on the
    # second executed unit before any mutation happens. That is a pre-existing
    # runtime bug this lane surfaces rather than anything fuzzing introduced --
    # it was simply never run.
    #
    # Making the lane blocking today would therefore paint nightly red on its
    # first execution over a known defect, which is how a lane teaches people to
    # ignore it -- the failure mode the full-suite comment above calls out.
    # Flip this to blocking (delete the line) once that teardown bug is fixed.
    # Unlike linux-msan, whose continue-on-error is permanent and caused by
    # uninstrumented system libraries, nothing here is unfixable.
    continue-on-error: true

    env:
      # UBSan findings must abort for libFuzzer to treat them as crashes;
      # left recoverable they only print and the run stays green.
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1"

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang ninja-build

      # ENABLE_FUZZING implies ASan + UBSan + SanitizerCoverage on every target,
      # so this build is materially slower than the other Linux lanes.
      - name: Configure (fuzzing)
        run: >-
          cmake -B build-fuzz -G Ninja
          -DENABLE_FUZZING=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      # Only the four harnesses, not the whole project: nothing else in the
      # tree needs to link libFuzzer.
      - name: Build harnesses
        run: >-
          cmake --build build-fuzz -j
          --target fuzz_lexer fuzz_parser fuzz_stdlib_data fuzz_xtp_decode

      - name: Fuzz
        run: |
          set -u
          work="${RUNNER_TEMP}/fuzz"
          findings="${work}/findings"
          mkdir -p "$findings"
          status=0

          # $1 target, $2 corpus subdir, $3 -max_len, $4 -max_total_time
          run_one() {
            corpus="${work}/corpus/$2"
            mkdir -p "$corpus"
            # libFuzzer writes every newly discovered input back into the first
            # corpus directory it is given. Point it at a scratch copy so the
            # checked-in seeds stay read-only -- on a throwaway runner that only
            # keeps the diff clean, but it also means anyone pasting these
            # commands locally does not silently grow tests/fuzz/corpus.
            cp -R "tests/fuzz/corpus/$2/." "$corpus/" 2>/dev/null || true

            echo "::group::$1"
            # -timeout=25 matters: libFuzzer's default per-input timeout is 1200s,
            # so without it one hanging input would consume the whole budget and
            # then the job timeout, reported as neither a crash nor a timeout.
            "build-fuzz/tests/fuzz/$1" "$corpus" \
              -max_total_time="$4" \
              -max_len="$3" \
              -timeout=25 \
              -print_final_stats=1 \
              -artifact_prefix="${findings}/$1-"
            rc=$?
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              echo "FAIL rc=$rc  $1" >> "${work}/report.txt"
              status=1
            else
              echo "ok        $1" >> "${work}/report.txt"
            fi
          }

          # Every harness runs even after one fails, so a first red night
          # reports all four results instead of only the earliest crash.
          run_one fuzz_lexer       lexer       4096 60
          run_one fuzz_parser      parser      4096 60
          run_one fuzz_stdlib_data stdlib_data 4096 60
          # fuzz_xtp_decode builds a full valid XTP artifact and runs two decode
          # paths per input, so -max_len is 256x larger and each execution costs
          # vastly more: measured at ~2 exec/s locally, against ~280 exec/s for
          # fuzz_parser. 120s buys it a few hundred executions, so treat this
          # one as an exercise of the decode paths rather than as search -- the
          # deterministic coverage comes from the test_xtp_fuzz_entry ctest.
          # Doubling the time here would not change that; persisting a corpus
          # across nights is what would.
          run_one fuzz_xtp_decode  xtp         1048576 120

          {
            echo "### libFuzzer smoke"
            echo '```'
            cat "${work}/report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      # always(), not failure(): the fuzz step runs all four harnesses and only
      # reports at the end, and libFuzzer can leave useful artifacts (slow-unit,
      # oom) on runs that still exit 0. if-no-files-found=ignore keeps a clean
      # night from warning.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/fuzz/findings
          if-no-files-found: ignore
          retention-days: 30
