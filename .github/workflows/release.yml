name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish'
        required: false
        default: ''
  repository_dispatch:
    types: [manual-release]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XRAY_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.client_payload.release_tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            artifact: xray-linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
            artifact: xray-linux-arm64
          - os: macos-15
            name: macos-arm64
            artifact: xray-macos-arm64
          - os: macos-15-intel
            name: macos-x64
            artifact: xray-macos-x64
          - os: windows-latest
            name: windows-x64
            artifact: xray-windows-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
    - name: Checkout
      shell: bash
      run: |
        git init .
        git remote add origin https://github.com/xray-lang/xray.git
        git fetch --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        git fetch --force --depth=1 origin \
          "refs/tags/$XRAY_RELEASE_TAG:refs/tags/$XRAY_RELEASE_TAG"

    - name: Install clang (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq clang

    - name: Install release dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install openssl@3

    - name: Install pinned Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Configure (Unix)
      if: runner.os != 'Windows'
      run: |
        extra=()
        if [ "$RUNNER_OS" = macOS ]; then
          extra+=(
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=15.0"
            "-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,-fatal_warnings"
          )
        fi
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DXRAY_BUNDLE_ZIG=OFF \
          "${extra[@]}"

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release `
          -DXRAY_BUNDLE_ZIG=OFF

    - name: Build
      run: cmake --build build --config Release

    - name: Build GNU AOT runtime (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zig = (Get-Command zig).Source
        $ccWrapper = Join-Path $env:RUNNER_TEMP 'xray-zig-cc.cmd'
        $cxxWrapper = Join-Path $env:RUNNER_TEMP 'xray-zig-cxx.cmd'
        $arWrapper = Join-Path $env:RUNNER_TEMP 'xray-zig-ar.cmd'
        $ranlibWrapper = Join-Path $env:RUNNER_TEMP 'xray-zig-ranlib.cmd'
        [IO.File]::WriteAllText(
          $ccWrapper,
          "@echo off`r`n`"$zig`" cc -target x86_64-windows-gnu %*`r`n",
          [Text.Encoding]::ASCII
        )
        [IO.File]::WriteAllText(
          $cxxWrapper,
          "@echo off`r`n`"$zig`" c++ -target x86_64-windows-gnu %*`r`n",
          [Text.Encoding]::ASCII
        )
        [IO.File]::WriteAllText(
          $arWrapper,
          "@echo off`r`n`"$zig`" ar %*`r`n",
          [Text.Encoding]::ASCII
        )
        [IO.File]::WriteAllText(
          $ranlibWrapper,
          "@echo off`r`n`"$zig`" ranlib %*`r`n",
          [Text.Encoding]::ASCII
        )
        cmake -S . -B build-zig-sdk -G Ninja `
          -DCMAKE_SYSTEM_NAME=Windows `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_C_COMPILER=$ccWrapper" `
          "-DCMAKE_CXX_COMPILER=$cxxWrapper" `
          "-DCMAKE_ASM_COMPILER=$ccWrapper" `
          "-DCMAKE_AR=$arWrapper" `
          "-DCMAKE_RANLIB=$ranlibWrapper" `
          "-DCMAKE_C_COMPILER_AR=$arWrapper" `
          "-DCMAKE_C_COMPILER_RANLIB=$ranlibWrapper" `
          "-DCMAKE_CXX_COMPILER_AR=$arWrapper" `
          "-DCMAKE_CXX_COMPILER_RANLIB=$ranlibWrapper" `
          -DENABLE_TLS=OFF `
          -DBUILD_TESTS=OFF `
          -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE `
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
        cmake --build build-zig-sdk --target xray_rt_coro xray_aot_core

    - name: Install package tree (Unix)
      if: runner.os != 'Windows'
      run: cmake --install build --prefix dist

    - name: Install package tree (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake --install build --config Release --prefix dist
        python scripts\stage_windows_gnu_runtime.py `
          --root dist `
          --target x86_64-windows-gnu `
          --aot-core build-zig-sdk\libxray_aot_core.a `
          --rt-coro build-zig-sdk\libxray_rt_coro.a
        if ($LASTEXITCODE -ne 0) { throw 'Windows GNU runtime staging failed' }
        $buildExe = @('build\Release\xray.exe', 'build\xray.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $buildExe) {
          throw 'xray.exe was not produced by the release build'
        }
        Copy-Item (Join-Path (Split-Path $buildExe) '*.dll') dist\bin\ -ErrorAction SilentlyContinue

        $searchDirs = @()
        if ($env:OPENSSL_ROOT_DIR) {
          $searchDirs += Join-Path $env:OPENSSL_ROOT_DIR 'bin'
        }
        $searchDirs += @(
          'C:\Program Files\OpenSSL\bin',
          'C:\Program Files\OpenSSL-Win64\bin',
          'C:\Program Files\FireDaemon OpenSSL 4\bin'
        )
        $searchDirs += ($env:PATH -split ';')
        foreach ($pattern in @('libssl*.dll', 'libcrypto*.dll')) {
          $dll = $searchDirs |
            Where-Object { $_ -and (Test-Path $_) } |
            ForEach-Object { Get-ChildItem -Path $_ -Filter $pattern -File -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName dist\bin\ -Force
            Write-Host "Copied $($dll.Name)"
          }
        }
        cmake "-DCMAKE_INSTALL_PREFIX=$((Resolve-Path dist).Path)" `
          -P build\generated\install\GeneratePayloadManifest.cmake

    - name: Verify release identity and payload (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/verify_payload_manifest.py --root dist --binary dist/bin/xray
        python3 scripts/verify_release_identity.py \
          --source . \
          --binary dist/bin/xray \
          --payload dist/share/xray/install/payload-manifest.json \
          --tag "$XRAY_RELEASE_TAG"
        if [ "$RUNNER_OS" = macOS ]; then
          minos=$(otool -l dist/bin/xray | awk '/LC_BUILD_VERSION/{seen=1} seen && /minos/{print $2; exit}')
          test "$minos" = 15.0
          if otool -L dist/bin/xray | grep -E '/(opt|usr/local)/(homebrew|Cellar|opt)/'; then
            echo "release binary depends on a package-manager prefix" >&2
            exit 1
          fi
        fi

    - name: Verify release identity and payload (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python scripts\verify_payload_manifest.py --root dist --binary dist\bin\xray.exe
        if ($LASTEXITCODE -ne 0) { throw 'payload verification failed' }
        python scripts\verify_release_identity.py `
          --source . `
          --binary dist\bin\xray.exe `
          --payload dist\share\xray\install\payload-manifest.json `
          --tag "$env:XRAY_RELEASE_TAG"
        if ($LASTEXITCODE -ne 0) { throw 'release identity verification failed' }

    # This is deliberately run from outside the checkout with all SDK path
    # overrides removed. It proves the release tree, not the development tree,
    # owns native AOT compilation. Zig remains an external/managed component
    # and is used explicitly only for cross-target gates.
    - name: Relocatable AOT smoke (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        smoke="$(mktemp -d)"
        trap 'rm -rf "$smoke"' EXIT
        cp tests/aot/filetests/link/runtime_time.xr "$smoke/runtime_time.xr"
        cp tests/aot/filetests/link/system_time_queries.xr "$smoke/system_time_queries.xr"
        cat > "$smoke/cross.xr" <<'XR_EOF'
        fn answer() -> int {
            return 42
        }

        answer()
        XR_EOF
        xray="$GITHUB_WORKSPACE/dist/bin/xray"
        unset XRAY_INCLUDE XRAY_LIB XRAY_STDLIB_PATH XRAY_ZIG
        "$xray" --version
        "$xray" toolchain probe --target native --provider host --refresh
        (cd "$smoke" && "$xray" build --native --dump-link-command runtime_time.xr -o runtime_time) \
          | tee "$smoke/native.log"
        test "$("$smoke/runtime_time")" = "7"
        (cd "$smoke" && "$xray" build --native system_time_queries.xr -o system_time_queries)
        test "$("$smoke/system_time_queries" | sort -u)" = "true"
        if grep -Fq "$GITHUB_WORKSPACE/src/aot" "$smoke/native.log"; then
          echo "release AOT command leaked the checkout path" >&2
          exit 1
        fi
        (cd "$smoke" && "$xray" build --native --toolchain zig --zig "$(command -v zig)" --target x86_64-linux-musl cross.xr -o cross-linux)
        test -s "$smoke/cross-linux"

    - name: Relocatable AOT smoke (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $smoke = Join-Path $env:RUNNER_TEMP 'xray-release-smoke'
        New-Item -ItemType Directory -Path $smoke -Force | Out-Null
        Copy-Item tests\aot\filetests\link\runtime_time.xr $smoke\runtime_time.xr
        Copy-Item tests\aot\filetests\link\system_time_queries.xr $smoke\system_time_queries.xr
        @'
        fn answer() -> int {
            return 42
        }

        print(answer())
        '@ | Set-Content -Encoding utf8 $smoke\cross.xr
        $xray = Join-Path $env:GITHUB_WORKSPACE 'dist\bin\xray.exe'
        Remove-Item Env:XRAY_INCLUDE -ErrorAction SilentlyContinue
        Remove-Item Env:XRAY_LIB -ErrorAction SilentlyContinue
        Remove-Item Env:XRAY_STDLIB_PATH -ErrorAction SilentlyContinue
        Remove-Item Env:XRAY_ZIG -ErrorAction SilentlyContinue
        & $xray --version
        if ($LASTEXITCODE -ne 0) { throw 'installed xray --version failed' }
        & $xray toolchain doctor
        if ($LASTEXITCODE -ne 0) { throw 'installed toolchain doctor failed' }
        $zig = (Get-Command zig).Source
        & $xray toolchain doctor --target native --provider zig --zig $zig --refresh
        if ($LASTEXITCODE -ne 0) { throw 'installed Zig GNU toolchain doctor failed' }
        python scripts\test_windows_runtime_abi_isolation.py --root dist --zig $zig
        if ($LASTEXITCODE -ne 0) { throw 'Windows runtime ABI isolation failed' }
        Push-Location $smoke
        try {
          & $xray build --native --dump-link-command runtime_time.xr -o runtime_time.exe
          if ($LASTEXITCODE -ne 0) { throw 'installed native AOT build failed' }
          $value = (& .\runtime_time.exe).Trim()
          if ($value -ne '7') { throw "installed native output was '$value'" }
          & $xray build --native system_time_queries.xr -o system_time_queries.exe
          if ($LASTEXITCODE -ne 0) { throw 'installed native AOT core build failed' }
          $timeValues = @(& .\system_time_queries.exe)
          if ($timeValues.Count -ne 5 -or $timeValues -contains 'false') {
            throw "installed AOT core output was '$($timeValues -join ',')'"
          }
          & $xray build --native --toolchain zig --zig $zig --target x86_64-windows-gnu cross.xr -o cross-zig.exe
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path cross-zig.exe)) {
            throw 'installed Zig GNU AOT build failed'
          }
          $zigValue = (& .\cross-zig.exe).Trim()
          if ($zigValue -ne '42') { throw "installed Zig GNU output was '$zigValue'" }
        } finally {
          Pop-Location
        }

    - name: Package (Unix)
      if: runner.os != 'Windows'
      run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }}.zip

    - name: Generate SBOM, checksums, and provenance (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python3 scripts/generate_release_evidence.py \
          --root dist \
          --artifact ${{ matrix.artifact }}.tar.gz \
          --output-prefix ${{ matrix.artifact }} \
          --commit "$GITHUB_SHA" \
          --builder "$GITHUB_WORKFLOW@$GITHUB_RUN_ID" \
          --created "$(git show -s --format=%cI "$GITHUB_SHA")"

    - name: Generate SBOM, checksums, and provenance (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $created = (git show -s --format=%cI $env:GITHUB_SHA).Trim()
        python scripts\generate_release_evidence.py `
          --root dist `
          --artifact ${{ matrix.artifact }}.zip `
          --output-prefix ${{ matrix.artifact }} `
          --commit $env:GITHUB_SHA `
          --builder "$env:GITHUB_WORKFLOW@$env:GITHUB_RUN_ID" `
          --created $created
        if ($LASTEXITCODE -ne 0) { throw 'release evidence generation failed' }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: |
          ${{ matrix.artifact }}.tar.gz
          ${{ matrix.artifact }}.zip
          ${{ matrix.artifact }}.spdx.json
          ${{ matrix.artifact }}.provenance.json
          ${{ matrix.artifact }}.sha256
          ${{ matrix.artifact }}.release.json

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Resolve release tag
      id: resolve_tag
      env:
        INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        DISPATCH_RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -n "$DISPATCH_RELEASE_TAG" ]; then
          echo "tag=$DISPATCH_RELEASE_TAG" >> "$GITHUB_OUTPUT"
        elif [ -n "$INPUT_RELEASE_TAG" ]; then
          echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
        else
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish Release
      env:
        GH_TOKEN: ${{ secrets.VSCODE_DISPATCH_TOKEN || secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
      run: |
        python3 - <<'PY'
        import json
        import mimetypes
        import os
        import pathlib
        import tempfile
        import urllib.error
        import urllib.parse
        import urllib.request
        import zipfile

        token = os.environ["GH_TOKEN"]
        tag = os.environ["RELEASE_TAG"]
        repo = os.environ["REPO"]
        run_id = os.environ["RUN_ID"]
        api = "https://api.github.com"
        headers = {
            "Authorization": f"Bearer {token}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
        }

        def request(method, url, data=None, content_type=None):
            req_headers = dict(headers)
            if content_type:
                req_headers["Content-Type"] = content_type
            req = urllib.request.Request(url, data=data, headers=req_headers, method=method)
            try:
                with urllib.request.urlopen(req) as resp:
                    return resp.status, resp.read()
            except urllib.error.HTTPError as exc:
                body = exc.read()
                if exc.code == 404:
                    return exc.code, body
                print(body.decode("utf-8", "replace"))
                raise

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                return None

        def download_artifact_archive(url):
            opener = urllib.request.build_opener(NoRedirect)
            req = urllib.request.Request(url, headers=headers, method="GET")
            try:
                with opener.open(req) as resp:
                    return resp.read()
            except urllib.error.HTTPError as exc:
                if exc.code not in (301, 302, 303, 307, 308):
                    raise
                signed_url = exc.headers["Location"]
            with urllib.request.urlopen(signed_url) as resp:
                return resp.read()

        artifacts_root = pathlib.Path("artifacts")
        artifacts_root.mkdir(exist_ok=True)
        status, body = request("GET", f"{api}/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100")
        artifacts = json.loads(body)["artifacts"]
        for artifact in artifacts:
            if artifact.get("expired"):
                continue
            archive = download_artifact_archive(artifact["archive_download_url"])
            archive_path = pathlib.Path(tempfile.gettempdir()) / f'{artifact["name"]}.zip'
            archive_path.write_bytes(archive)
            target_dir = artifacts_root / artifact["name"]
            target_dir.mkdir(parents=True, exist_ok=True)
            with zipfile.ZipFile(archive_path) as zf:
                zf.extractall(target_dir)

        files = sorted(path for path in artifacts_root.rglob("*") if path.is_file())
        if not files:
            raise SystemExit("no release artifacts were downloaded")

        status, body = request("GET", f"{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag, safe='')}")
        if status == 404:
            payload = json.dumps({
                "tag_name": tag,
                "name": tag,
                "generate_release_notes": True,
                "draft": False,
                "prerelease": False,
            }).encode()
            status, body = request("POST", f"{api}/repos/{repo}/releases", payload, "application/json")
        release = json.loads(body)
        release_id = release["id"]

        status, body = request("GET", f"{api}/repos/{repo}/releases/{release_id}/assets?per_page=100")
        existing = {asset["name"]: asset["id"] for asset in json.loads(body)}
        for path in files:
            name = path.name
            if name in existing:
                raise SystemExit(f"immutable release asset already exists: {name}")
            upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={urllib.parse.quote(name)}"
            content_type = mimetypes.guess_type(name)[0] or "application/octet-stream"
            status, body = request("POST", upload_url, path.read_bytes(), content_type)
            asset = json.loads(body)
            print(f'uploaded {asset["name"]}')
        PY

    - name: Dispatch exact release request to xray-installer
      env:
        GH_TOKEN: ${{ secrets.INSTALLER_DISPATCH_TOKEN }}
        RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        COMMIT: ${{ github.sha }}
      run: |
        test -n "$GH_TOKEN"
        python3 - <<'PY'
        import json
        import os
        import pathlib
        import urllib.request

        tag = os.environ["RELEASE_TAG"]
        commit = os.environ["COMMIT"]
        metadata_files = sorted(pathlib.Path("artifacts").rglob("*.release.json"))
        payloads = []
        target_map = {
            "macos-arm64": ("macos", "arm64"),
            "macos-x86_64": ("macos", "x64"),
            "linux-arm64": ("linux", "arm64"),
            "linux-x86_64": ("linux", "x64"),
            "windows-x86_64": ("windows", "x64"),
        }
        for path in metadata_files:
            value = json.loads(path.read_text(encoding="utf-8"))
            target = value.get("target")
            if target not in target_map:
                continue
            if value.get("schema") != 1 or value.get("commit") != commit or value.get("dirty") is not False:
                raise SystemExit(f"invalid release metadata: {path}")
            platform, arch = target_map[target]
            artifact = value["artifact"]
            payloads.append({
                "platform": platform,
                "arch": arch,
                "target": target,
                "url": f"https://github.com/xray-lang/xray/releases/download/{tag}/{artifact['name']}",
                "size": artifact["size"],
                "sha256": artifact["sha256"],
                "payloadManifestSha256": value["payloadManifest"]["sha256"],
            })
        if len(payloads) != 5:
            raise SystemExit(f"expected five release payloads, got {len(payloads)}")
        versions = {json.loads(path.read_text(encoding="utf-8"))["version"] for path in metadata_files}
        if len(versions) != 1:
            raise SystemExit("release metadata versions disagree")
        body = json.dumps({
            "event_type": "xray-release-ready",
            "client_payload": {
                "schema": 1,
                "version": versions.pop(),
                "commit": commit,
                "releaseTag": tag,
                "payloads": sorted(payloads, key=lambda item: (item["platform"], item["arch"])),
            },
        }).encode()
        request = urllib.request.Request(
            "https://api.github.com/repos/xray-lang/xray-installer/dispatches",
            data=body,
            headers={
                "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2022-11-28",
            },
            method="POST",
        )
        with urllib.request.urlopen(request) as response:
            if response.status != 204:
                raise SystemExit(f"installer dispatch returned HTTP {response.status}")
        PY

    - name: Trigger VS Code extension publish
      if: success()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.VSCODE_DISPATCH_TOKEN || secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        XRAY_TAG: ${{ steps.resolve_tag.outputs.tag }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import urllib.request

        payload = json.dumps({
            "event_type": "xray-release",
            "client_payload": {"xray_tag": os.environ["XRAY_TAG"]},
        }).encode()
        req = urllib.request.Request(
            "https://api.github.com/repos/xray-lang/xray-vscode/dispatches",
            data=payload,
            headers={
                "Authorization": f'Bearer {os.environ["GH_TOKEN"]}',
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2022-11-28",
            },
            method="POST",
        )
        with urllib.request.urlopen(req) as resp:
            print(resp.status)
        PY

  # Deploy the freshly built linux-x64 xray binary to the playground server
  # so that www.xray-lang.org/playground always runs the latest release.
  # Skips silently if SERVER_HOST is not configured (e.g. forks).
  deploy-runtime:
    needs: [build, release]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: ${{ always() && needs.build.result == 'success' }}

    steps:
    - name: Skip if SERVER_HOST not configured
      id: gate
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
      run: |
        if [ -z "$SERVER_HOST" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice::SERVER_HOST not set; skipping playground deploy."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download linux-x64 artifact
      if: steps.gate.outputs.skip != 'true'
      uses: actions/download-artifact@v4
      with:
        name: xray-linux-x64
        path: artifact

    - name: Extract xray binary
      if: steps.gate.outputs.skip != 'true'
      run: |
        cd artifact
        tar -xzf xray-linux-x64.tar.gz
        file bin/xray
        ./bin/xray --version

    - name: Upload xray binary to server
      if: steps.gate.outputs.skip != 'true'
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "artifact/bin/xray"
        target: "/tmp"
        strip_components: 2

    - name: Install + restart xray-server
      if: steps.gate.outputs.skip != 'true'
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          ts=$(date +%Y%m%d-%H%M%S)
          if [ -f /usr/local/bin/xray ]; then
              cp -v /usr/local/bin/xray "/usr/local/bin/xray.bak.$ts"
          fi
          chmod 0755 /tmp/xray
          chown root:root /tmp/xray
          mv -v /tmp/xray /usr/local/bin/xray
          /usr/local/bin/xray --version
          systemctl restart xray-server
          sleep 1
          systemctl is-active xray-server
