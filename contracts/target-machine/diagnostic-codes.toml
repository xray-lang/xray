schema = 1
registry = "xray-target-machine-diagnostics"

[policy]
unknown_code = "error"
duplicate_code = "error"
renumbering = "forbidden"
pointer_in_diagnostic_identity = false
required_context = ["plan_fingerprint", "function_or_module_id", "source_span"]
optional_context = ["operation_id", "layout_id", "owner_id", "state_id", "generation_id"]

[[family]]
prefix = "XR_SEM_"
range = "0001-0999"
owner = "semantic-plan-verifier"

[[family]]
prefix = "XR_TARGET_"
range = "1000-1999"
owner = "target-plan-verifier"

[[family]]
prefix = "XR_ARTIFACT_"
range = "2000-2999"
owner = "artifact-decoder-verifier"

[[family]]
prefix = "XR_OWN_"
range = "3000-3999"
owner = "ownership-certificate-checker"

[[family]]
prefix = "XR_CORO_"
range = "4000-4999"
owner = "coroutine-machine-verifier"

[[family]]
prefix = "XR_EXEC_"
range = "5000-5999"
owner = "typed-executor"

[[code]]
id = "XR_SEM_0001"
name = "unknown-operation-owner"
message = "semantic operation has no unique registered owner"

[[code]]
id = "XR_SEM_0002"
name = "unstable-identity-input"
message = "semantic identity contains a process-local or order-dependent input"

[[code]]
id = "XR_SEM_0003"
