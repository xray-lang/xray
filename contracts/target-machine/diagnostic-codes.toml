# --- named families ----------------------------------------------------------
#
# These two spell their identity in words instead of digits, and new families
# should follow them.
#
# A numbered code answers "which verifier refused" and stops there. It was
# measured on 2026-08-28 that XR_TARGET_1003 alone carries 185 distinct message
# texts across src/plan/target/, so grouping refusals by code collapses 185
# unrelated causes into one bucket and the code carries no resolution of its
# own. A named code is its own distinction: the reader needs no second lookup
# to know what was refused.
#
# The numbered families are not being renumbered -- renumbering = "forbidden"
# above, and their identities are already in artifacts.

[[family]]
prefix = "XR_AOT_REFINEMENT_"
kind = "named"
owner = "aot-representation-refinement"

[[family]]
prefix = "XR_AOT_TAIL_CALL_CONFORMANCE_"
kind = "named"
owner = "aot-tail-call-conformance"


