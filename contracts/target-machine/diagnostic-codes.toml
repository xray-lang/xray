[[family]]
prefix = "XR_CORO_"
kind = "numbered"
range = "4000-4999"
owner = "coroutine-machine-verifier"

[[family]]
prefix = "XR_EXEC_"
kind = "numbered"
range = "5000-5999"
owner = "typed-executor"

