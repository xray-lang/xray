[[operation]]
id = "Array.sort"
observable_contract = "contracts/sort-semantics.md"
semantic_kernel = "src/shared/xr_sort_core.h"
vm_adapter = "src/runtime/object/xarray_vm.c"
aot_adapter = "src/aot/xrt_sort.inc.c"
typed_plan = "array-element-representation"
runtime_fallback = "none"
fixtures = [
  "tests/unit/stdlib/test_array_core.c",
  "tests/diff/cases/semantics/collections/array_sort_shared_core.xr",
]
performance_evidence = "contracts/semantic-performance-baseline.json"
runtime_benchmark = "contracts/semantic-runtime-benchmark.json"
performance_budget = "contracts/semantic-performance-budget.toml"

[[operation]]
id = "typeOf"
observable_contract = "src/shared/xr_type_identity_core.h"
semantic_kernel = "src/shared/xr_type_identity_core.h"
vm_adapter = "src/runtime/value/xvalue_typeid.c"
aot_adapter = "src/aot/xrt_arith.h"
typed_plan = "primitive.type-identity"
runtime_fallback = "none"
fixtures = [
  "tests/unit/stdlib/test_type_identity_core.c",
  "tests/unit/ir/test_xi_cgen.c",
  "tests/regression/09_advanced/0912_typeof_builtin.xr",
]

[[operation_family]]
id = "arithmetic-conversion"
