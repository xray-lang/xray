schema = 1
module = "mem"
contract_revision = 1
legacy_commit = "971205b8e773e1d3eeaeafb9432355cf8be038e6"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/mem/legacy_expected.jsonl"
legacy_public_surface = [
  "Buffer",
  "alloc",
  "allocZeroed",
  "copy",
  "move",
  "set",
  "compare",
  "view",
]
intentional_semantic_changes = [
  "mem publishes Buffer and its capability surface from stdlib/mem/mem.xr; only the private provider storage, raw host operations, and compiler-owned layout/borrow intrinsics remain native",
  "writable Buffer views use the existing scoped mem.withSliceMut(pointer, count, ref owner, callback) composition instead of a mutable Slice-returning method; no compatibility alias is retained",
  "what stays native is decided by expressibility, not by layer: the layout and pointer intrinsics (sizeOf, alignOf, offsetOf, ptr, mutPtr, load, store, slice, withSliceMut, assumeInitialized) take their result type from an explicit type argument that Xray cannot restate, and provider-owned storage carries structural reclamation without a user destructor hook",
  "this contract remains a behaviour baseline lock: it pins results, not the language the results are computed in",
]
known_legacy_bugs = [
  "none recorded for the native baseline",
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/mem/diff_cases.txt"
benchmark_suite = "stdlib/mem"

[[legacy_behavior]]
id = "alloc-bulk-semantics"
classification = "required"
new_behavior = "alloc/copy/move/set/compare produce identical byte effects on VM and AOT"

[[legacy_behavior]]
id = "buffer-raii"
classification = "required"
new_behavior = "the RAII Buffer owns and releases its allocation identically on VM and AOT"
