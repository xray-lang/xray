schema = 1
module = "base64"
contract_revision = 2
legacy_commit = "e50953853746185e1f2e8e2d6371898166c6a42a"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/base64/legacy_expected.jsonl"
legacy_public_surface = [
  "encode",
  "decode",
  "encodeBytes",
  "decodeToBytes",
  "encodeUrl",
  "decodeUrl",
  "isValid"
]
intentional_semantic_changes = [
  "public encode accepts Slice<byte>",
  "decode returns Array<byte> and throws Base64Error on invalid input",
  "URL-safe and padding policy are explicit options",
  "encodeBytes/decodeToBytes/encodeUrl/decodeUrl aliases are removed"
]
known_legacy_bugs = ["legacy decoder accepted non-canonical trailing bits"]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/base64/diff_cases.txt"
