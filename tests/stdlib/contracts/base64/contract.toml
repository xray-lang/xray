[[legacy_behavior]]
id = "rfc4648-roundtrip"
classification = "required"
new_behavior = "standard and URL-safe alphabets round-trip through Slice<byte>/Array<byte> on VM and AOT"

[[legacy_behavior]]
id = "typed-error-invalid-input"
classification = "required"
new_behavior = "invalid encodings throw Base64Error and do not produce partial output"

[[legacy_behavior]]
id = "canonical-trailing-bits"
classification = "bug"
new_behavior = "decoding rejects non-zero unused bits and reports the offending byte offset"

[[legacy_behavior]]
id = "explicit-alphabet-padding-policy"
classification = "required"
new_behavior = "standard and URL-safe alphabets plus required, optional, or forbidden padding are selected explicitly"
