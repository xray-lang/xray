schema = 1
module = "toml"
contract_revision = 1
legacy_commit = "971205b8e773e1d3eeaeafb9432355cf8be038e6"
legacy_oracle = "classification_only"
legacy_public_surface = [
  "parse",
  "parseReport",
  "stringify",
  "get",
  "at",
  "asString",
  "asInt",
  "asBool",
]
intentional_semantic_changes = [
  "TOML parse/stringify semantics are owned by stdlib/toml/toml.xr as the sole source",
  "the value domain is the typed TomlValue enum rather than a Json projection",
  "parseReport diagnostics are Array<TomlDiagnostic> with a TomlErrorKind enum, not Json objects",
  "recoverable parse failures are reported as structured diagnostics, not string discriminators",
]
known_legacy_bugs = [
  "the pre-migration Json diagnostic object carried an unused row:-1 field with no typed kind",
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/toml/diff_cases.txt"
benchmark_suite = "stdlib/toml"

[[legacy_behavior]]
id = "toml-value-domain"
classification = "required"
new_behavior = "parse returns the typed TomlValue enum covering string/integer/float/boolean/datetime/array/table"

[[legacy_behavior]]
id = "typed-parse-diagnostics"
classification = "required"
new_behavior = "parseReport returns TomlParseReport whose errors are Array<TomlDiagnostic> keyed by TomlErrorKind with line/column/message"

[[legacy_behavior]]
id = "stringify-roundtrip"
classification = "required"
new_behavior = "stringify emits canonical TOML that parses back to an equal TomlValue for the covered value domain"

[[legacy_behavior]]
id = "json-diagnostic-object-removed"
classification = "removed"
new_behavior = "the pre-migration Json diagnostic object (type/line/row/column/message) is replaced by TomlDiagnostic; no Json diagnostic surface remains"
