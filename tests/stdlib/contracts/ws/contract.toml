schema = 1
module = "ws"
contract_revision = 1
legacy_commit = "05b0bf0f61cb2e8a39ba294570dd62cdc1f5b54e"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/ws/legacy_expected.jsonl"
legacy_public_surface = [
  "WsMessage",
  "acceptKey",
  "randomKey",
  "parseUpgradeRequest",
  "upgradeResponse",
  "clientHandshakeRequest",
  "parseUpgradeResponse",
  "parseUrl",
  "parseClosePayload",
  "maskPayload",
  "parseFrame",
  "frame",
  "textFrame",
  "binaryFrame",
  "closeFrame",
  "pingFrame",
  "pongFrame"
]
intentional_semantic_changes = [
  "WebSocket protocol helpers carry frame payloads as Array<byte>",
  "close payload reason decoding remains strict UTF-8 and rejects malformed bytes",
  "masking and frame parsing preserve exact byte payloads across VM and AOT",
  "future WsMessage convergence should distinguish text and binary messages without string-binary aliases"
]
known_legacy_bugs = [
  "connection-level message APIs still need the final binary/text ADT switch after native contracts stabilize",
  "legacy close reason decoding rendered UTF-8 bytes through Array.toString instead of constructing a string",
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/ws/diff_cases.txt"
benchmark_suite = "stdlib/ws"

[[legacy_behavior]]
id = "rfc6455-accept-key"
classification = "required"
new_behavior = "Sec-WebSocket-Accept derives from Base64(SHA1(key || GUID)) and matches RFC 6455 vectors"

[[legacy_behavior]]
id = "upgrade-handshake"
classification = "required"
new_behavior = "client and server upgrade helpers validate method, headers, origin, protocol, and permessage-deflate negotiation"

[[legacy_behavior]]
id = "close-payload-utf8"
classification = "required"
new_behavior = "close payloads parse code plus strict UTF-8 reason bytes and reject malformed or oversized payloads"

[[legacy_behavior]]
id = "frame-byte-roundtrip"
classification = "required"
new_behavior = "maskPayload, frame, and parseFrame preserve exact byte payloads, extended lengths, mask rules, and consumed-byte counts"

[[legacy_behavior]]
id = "string-binary-message-alias"
classification = "removed"
new_behavior = "future WsMessage public surface must distinguish text and binary payloads without treating arbitrary bytes as string"

[[legacy_behavior]]
id = "close-reason-array-render"
classification = "bug"
new_behavior = "valid UTF-8 close reason bytes decode to their text string rather than an Array<byte> debug rendering"
