schema = 1
module = "io"
contract_revision = 1
legacy_commit = "0a9f6fdb5bd77e5c1a5d729bd68a1064b1c5e6e7"
legacy_oracle = "classification_only"
legacy_public_surface = [
  "readFile",
  "readFileBytes",
  "writeFile",
  "writeFileBytes",
  "readLines",
  "stat"
]
intentional_semantic_changes = [
  "text file APIs keep string storage and binary file APIs carry Array<byte>",
  "readFileBytes and writeFileBytes preserve arbitrary byte values including NUL and 0xff",
  "future net/io buffer convergence must keep text and binary entry points distinct",
  "path ownership remains Path-based rather than reintroducing string path overloads"
]
known_legacy_bugs = [
  "legacy callers could still route arbitrary bytes through string APIs in adjacent modules"
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/io/diff_cases.txt"
benchmark_suite = "stdlib/io"

[[legacy_behavior]]
id = "text-binary-file-split"
classification = "required"
new_behavior = "readFile/writeFile remain text APIs while readFileBytes/writeFileBytes preserve Array<byte> payloads"

[[legacy_behavior]]
id = "byte-file-roundtrip"
classification = "required"
new_behavior = "byte files round-trip arbitrary bytes and lengths on VM and AOT"

[[legacy_behavior]]
id = "path-owner-boundary"
classification = "required"
new_behavior = "filesystem APIs accept Path values at the boundary instead of string path aliases"

[[legacy_behavior]]
id = "string-binary-file-overlap"
classification = "removed"
new_behavior = "future converged binary I/O must not add string fallbacks for arbitrary byte payloads"
