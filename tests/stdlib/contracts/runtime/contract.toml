schema = 1
module = "runtime"
contract_revision = 4
legacy_commit = "5ba146f59ba3f2518e457ea9ac2dd0f7b246d5ee"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/runtime/legacy_expected.jsonl"
legacy_public_surface = [
  "RuntimeInfo",
  "collectCycles",
  "disableCycleCollection",
  "enableCycleCollection",
  "isCycleCollectionEnabled",
  "liveBytes",
  "liveObjects",
  "info",
]
intentional_semantic_changes = [
  "cycle-collector control and heap introspection moved from mem to the dedicated runtime module",
  "the cycle-collector control plane (collectCycles, enable/disable/isCycleCollectionEnabled, info.cycleCollections) is gone with the collector itself (task 247); the four entry points were deleted rather than stubbed, so calling one is a compile error and not a silent no-op",
  "standalone AOT reads the provider-owned current execution arena through scalar counter leaves",
  "RuntimeInfo is constructed entirely in runtime.xr; the native __RuntimeStats shape and __stats object-return fast path were deleted",
  "allocator-internal blocks/freeBlocks/fullBlocks were removed because the execution-arena backend cannot provide them; RuntimeInfo now contains only backend-independent counters",
]
known_legacy_bugs = []
equivalence = ["value", "error", "effect", "complexity"]
backends = ["vm", "aot"]
diff_cases_manifest = "tests/stdlib/contracts/runtime/diff_cases.txt"
benchmark_suite = "stdlib/runtime"

[[legacy_behavior]]
id = "cycle-collector-toggle"
classification = "removed"
new_behavior = "no successor: task 247 deleted the cycle collector, so there is no automatic pass to toggle. Reclamation is reference counting alone and its point is exact; a cycle is prevented at the type graph, broken with a `weak` field, or bounded by its execution-local reclamation domain"

[[legacy_behavior]]
id = "heap-counters"
classification = "required"
new_behavior = "liveBytes, liveObjects, finalizerCount, and info expose non-negative counters from the current execution-local reclamation domain"

[[legacy_behavior]]
id = "standalone-aot-introspection"
classification = "removed"
new_behavior = "standalone AOT exposes the current provider execution arena rather than rejecting the runtime control plane"
