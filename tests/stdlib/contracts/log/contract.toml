schema = 1
module = "log"
contract_revision = 1
legacy_commit = "971205b8e773e1d3eeaeafb9432355cf8be038e6"
legacy_oracle = "classification_only"
legacy_public_surface = [
  "setLevel",
  "setFormat",
  "isEnabled",
  "debug",
  "info",
  "warn",
  "error",
  "child",
]
intentional_semantic_changes = [
  "log level and output format are typed enums (LogLevel, LogFormat) owned by stdlib/log/log.xr",
  "setLevel accepts LogLevel and setFormat accepts LogFormat; no int constants or magic strings remain",
  "level filtering compares LogLevel variants rather than int thresholds",
]
known_legacy_bugs = [
  "the pre-migration API exposed int level constants (DEBUG..FATAL) and a Json/int dual-mode setLevel plus string setFormat with no compile-time checking",
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/log/diff_cases.txt"
benchmark_suite = "stdlib/log"

[[legacy_behavior]]
id = "typed-level-format"
classification = "required"
new_behavior = "setLevel/isEnabled use the LogLevel enum and setFormat uses the LogFormat enum with compile-time checking"

[[legacy_behavior]]
id = "level-ordering"
classification = "required"
new_behavior = "level filtering enables a record iff its LogLevel is at or above the configured level, preserving Debug<Info<Warn<Error<Fatal ordering"

[[legacy_behavior]]
id = "int-constants-removed"
classification = "removed"
new_behavior = "the exported int level constants (DEBUG/INFO/WARN/ERROR/FATAL), the Json/int setLevel, and the string setFormat are removed with compile-error guards"
