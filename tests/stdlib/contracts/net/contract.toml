  "UdpPacket"
]
intentional_semantic_changes = [
  "net.read and net.write are removed; stream I/O is byte-only through readInto, readBytes and writeBytes",
  "dial takes DialOptions and throws typed NetError values; dialTLS is folded into DialOptions.tls and upgradeTLS covers STARTTLS flows",
  "listen, udpBind and upgradeTLS throw NetError instead of returning null handles",
  "lookup returns Array<IpAddress>, empty on failure, instead of string?",
  "UdpPacket is removed; recvFrom fills a caller buffer and returns UdpFrom sender identity under an explicit timeoutMs",
  "sendTo takes Array<u8> payloads and an explicit timeoutMs",
  "copyBidirectional throws NetError only for argument validation (Closed, Invalid); a per-direction I/O error ends that direction and the byte counts are still returned",
  "NetError gains Cancelled so cooperative cancellation is distinct from Closed",
  "NetConn and NetListener expose no native instance methods; handle state, lifecycle, direction, and deadline policy are source-owned net module functions"
]
# Byte-first convergence roadmap:
#   converged byte read: readBytes returns Array<u8>
#   future converged writeBytes and sendTo accept Slice<u8>
known_legacy_bugs = [
  "legacy net.read exposes arbitrary socket bytes as string?",
  "legacy dial/listen/udpBind/upgradeTLS report setup failure as null without a typed reason",
  "legacy TLS handshake timeouts re-arm at full value on every yield instead of enforcing one absolute deadline",
  "legacy cooperative cancellation surfaces as NetError.Closed",
  "legacy recvFrom has no timeout parameter and can wait forever"
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/net/diff_cases.txt"
benchmark_suite = "stdlib/net"

[[legacy_behavior]]
id = "loopback-string-status-sentinels"
classification = "removed"
new_behavior = "stream I/O is byte-only (readInto/readBytes/writeBytes); connection setup throws typed NetError values and per-operation failures keep in-band results with lastError carrying the reason"

[[legacy_behavior]]
id = "high-byte-loopback"
classification = "required"
new_behavior = "socket loopback preserves high-byte octets exactly through the Array<u8> surface (writeBytes/readInto)"

[[legacy_behavior]]
id = "native-copy-byte-boundary"
classification = "required"
new_behavior = "net.copy and copyBidirectional are Xray-owned pumps over reusable Array<u8> buffers; a mid-stream error ends the pump and reports the byte count, with the reason queryable via lastError"

[[legacy_behavior]]
id = "timeout-rearm-per-yield"
classification = "bug"
new_behavior = "TLS handshake timeouts (dial with DialOptions.tls, upgradeTLS) are one absolute deadline for the whole handshake instead of a full re-arm on every yield"

[[legacy_behavior]]
id = "cancelled-reported-as-closed"
classification = "bug"
new_behavior = "cooperative cancellation classifies as NetError.Cancelled, distinct from NetError.Closed"

[[legacy_behavior]]
id = "udp-recv-unbounded-wait"
classification = "bug"
new_behavior = "recvFrom takes an explicit timeoutMs (negative waits without limit) instead of an implicit unbounded wait"
