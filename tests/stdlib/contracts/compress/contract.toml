schema = 1
module = "compress"
contract_revision = 3
legacy_commit = "d5cfcb587219468fde5bf8cda6cb76df875cf25b"
legacy_oracle = "classification_only"
legacy_public_surface = [
  "crc32",
  "adler32",
  "gzip",
  "gunzip",
  "isGzip",
  "deflate",
  "inflate",
  "zlibCompress",
  "zlibDecompress",
  "isZlib"
]
intentional_semantic_changes = [
  "public convergence target uses Slice<byte> inputs and Array<byte> outputs after the native error ABI is stable",
  "decompression failures must become typed CompressionError values instead of null sentinels in the native switch",
  "checksum values remain stable across old string storage and future byte slices",
  "compression and decompression helpers must not construct string storage for arbitrary bytes once the ABI switches"
]
known_legacy_bugs = [
  "legacy compressed payloads are carried as string values even when the bytes are not text",
  "legacy decompression failure is reported through nullable output instead of a typed error"
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/compress/diff_cases.txt"
benchmark_suite = "stdlib/compress"

[[legacy_behavior]]
id = "checksum-known-values"
classification = "required"
new_behavior = "CRC32 and Adler32 official vectors keep identical numeric values on VM and AOT"

[[legacy_behavior]]
id = "roundtrip-formats"
classification = "required"
new_behavior = "gzip, deflate, and zlib round-trip data and reject malformed payloads deterministically"

[[legacy_behavior]]
id = "truncated-input-classification"
classification = "required"
new_behavior = "truncated gzip, deflate, and zlib payloads keep the same failure classification before becoming CompressionError.TruncatedInput"

[[legacy_behavior]]
id = "nullable-decompression-failure"
classification = "removed"
new_behavior = "future converged decompression APIs throw CompressionError and never use null as a failure sentinel"

[[legacy_behavior]]
id = "string-binary-payloads"
classification = "removed"
new_behavior = "future converged compression APIs carry arbitrary bytes through Slice<byte> and Array<byte>, not string storage"
