schema = 1
module = "compress"
contract_revision = 4
legacy_commit = "d5cfcb587219468fde5bf8cda6cb76df875cf25b"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/compress/legacy_expected.jsonl"
legacy_public_surface = [
  "crc32",
  "adler32",
  "gzip",
  "gunzip",
  "isGzip",
  "deflate",
  "inflate",
  "zlibCompress",
  "zlibDecompress",
  "isZlib"
]
intentional_semantic_changes = [
  "public surface takes Slice<u8> inputs and answers Array<u8> outputs",
  "decompression failures are typed CompressionError values, not null sentinels",
  "checksum values are unchanged from the old string storage to the byte slices that replaced it",
  "compression and decompression construct no string storage for arbitrary bytes",
  "compression no longer answers an optional: it has no failure mode short of exhausting memory",
  "the whole coder is stated in compress.xr; the module has no native runtime"
]
known_legacy_bugs = [
  "legacy compressed payloads are carried as string values even when the bytes are not text",
  "legacy decompression failure is reported through nullable output instead of a typed error"
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/compress/diff_cases.txt"
benchmark_suite = "stdlib/compress"

[[legacy_behavior]]
id = "checksum-known-values"
classification = "required"
new_behavior = "CRC32 and Adler32 official vectors keep identical numeric values on VM and AOT"

[[legacy_behavior]]
id = "roundtrip-formats"
classification = "required"
new_behavior = "gzip, deflate, and zlib round-trip data and reject malformed payloads deterministically"

[[legacy_behavior]]
id = "truncated-input-classification"
classification = "required"
new_behavior = "truncated gzip, deflate, and zlib payloads keep the same failure classification, reported as CompressionError.InvalidData"

[[legacy_behavior]]
id = "nullable-decompression-failure"
classification = "removed"
new_behavior = "decompression throws CompressionError and never uses null as a failure sentinel"

[[legacy_behavior]]
id = "string-binary-payloads"
classification = "removed"
new_behavior = "compression carries arbitrary bytes through Slice<u8> and Array<u8>, not string storage"
