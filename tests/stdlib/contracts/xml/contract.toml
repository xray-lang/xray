schema = 1
module = "xml"
contract_revision = 1
legacy_commit = "971205b8e773e1d3eeaeafb9432355cf8be038e6"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/xml/legacy_expected.jsonl"
legacy_public_surface = [
  "parse",
  "parseReport",
  "stringify",
  "document",
  "element",
  "text",
  "comment",
  "cdata",
]
intentional_semantic_changes = [
  "XML parse/stringify/builder semantics are owned by stdlib/xml/xml.xr as the sole source",
  "the node model is the typed XmlNode enum (Document/Element/Text/Comment/CData/PI), not a Json tree",
  "element names are the typed XmlName (prefix/local) and attributes are ordered XmlAttribute values",
  "parse failures raise typed XmlError; recoverable diagnostics use XmlDiagnostic keyed by XmlErrorKind",
]
known_legacy_bugs = [
  "the pre-migration Json node tree used a string type discriminator and could not separate namespace from local name",
]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/xml/diff_cases.txt"
benchmark_suite = "stdlib/xml"

[[legacy_behavior]]
id = "xmlnode-adt"
classification = "required"
new_behavior = "parse returns the typed XmlNode enum and preserves element order, attributes, and text content"

[[legacy_behavior]]
id = "typed-parse-diagnostics"
classification = "required"
new_behavior = "parseReport returns typed diagnostics (XmlDiagnostic/XmlErrorKind) instead of Json error objects"

[[legacy_behavior]]
id = "stringify-roundtrip"
classification = "required"
new_behavior = "stringify emits XML that parses back to an equal XmlNode for the covered node domain"

[[legacy_behavior]]
id = "json-node-tree-removed"
classification = "removed"
new_behavior = "the pre-migration Json node tree with string type discriminators is replaced by the XmlNode enum; no Json node surface remains"
