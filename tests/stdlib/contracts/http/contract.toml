schema = 1
module = "http"
contract_revision = 5
legacy_commit = "95172da726477612a09e76258cc05a585886e124"
legacy_oracle = "executable"
legacy_cases_manifest = "tests/stdlib/contracts/http/legacy_expected.jsonl"
legacy_public_surface = [
  "requestText",
  "responseText",
  "parseRequestHead",
  "parseResponseHead",
  "parseRequestText",
  "parseResponseText"
]
intentional_semantic_changes = [
  "the executable legacy baseline is the final Json-header parser surface before typed Headers landed",
  "HTTP control-plane helpers are owned by stdlib/http/http.xr",
  "Headers replaces Json plus parallel headerPairs/trailerPairs fields",
  "requestText and responseText accept only Headers rather than Json objects",
  "complete request/response parsers keep body framing explicit and byte-counted",
  "HTTP text helpers may expose string bodies only after framing and UTF-8 boundaries are validated",
  "request uses HttpRequestOptions and returns byte-owned HttpResponse values",
  "routeHandler accepts HttpRequest callbacks that return HttpResponse",
]
known_legacy_bugs = ["legacy helper behavior is not authoritative for conflicting framing headers"]
equivalence = ["value", "error", "effect", "complexity"]
diff_cases_manifest = "tests/stdlib/contracts/http/diff_cases.txt"
benchmark_suite = "stdlib/http"

[[legacy_behavior]]
id = "header-order-and-duplicates"
classification = "required"
new_behavior = "wire order and duplicate header observations are preserved"

[[legacy_behavior]]
id = "conflicting-content-length"
classification = "bug"
new_behavior = "conflicting framing is rejected by the typed HTTP contract"

[[legacy_behavior]]
id = "json-header-object"
classification = "removed"
new_behavior = "Headers preserves insertion order, duplicates, original casing, and case-insensitive lookup"

[[legacy_behavior]]
id = "formatter-json-header-parameter"
classification = "removed"
new_behavior = "requestText and responseText require validated Headers values"

[[legacy_behavior]]
id = "request-body-framing"
classification = "required"
new_behavior = "parseRequestText consumes exactly Content-Length or chunked body bytes, preserves trailers, and rejects conflicting or incomplete framing"

[[legacy_behavior]]
id = "response-body-framing"
classification = "required"
new_behavior = "parseResponseText consumes fixed, chunked, close-delimited, and no-body responses with explicit consumed byte counts"

[[legacy_behavior]]
id = "binary-body-string-shortcut"
classification = "removed"
new_behavior = "typed HTTP responses carry non-text bodies through owned bytes and use text or JSON only through explicit decoding methods"
