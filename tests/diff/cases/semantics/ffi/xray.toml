[package]
name = "backend-diff-ffi"
version = "1.0.0"
license = "MIT"

[native]
name = "backend-diff-platform-ffi"
version = "1"
license = "platform"
source = "host C library and math library"
audit_mode = "exploratory"
vm = "verified-dynamic"

[[native.unit]]
name = "libc"
kind = "platform"
optimization = "none"
visibility = "default"
warnings = "system"
purpose = "resolve process C symbols used by differential FFI fixtures"

[[native.unit]]
name = "libm"
kind = "platform"
system_links = ["m"]
optimization = "none"
visibility = "default"
warnings = "system"
purpose = "resolve reachable host math symbols"

