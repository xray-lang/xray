[package]
name = "filetest-freestanding_assert_hook"
version = "1.0.0"
license = "MIT"
main = "freestanding_assert_hook.xr"

[[export.c]]
xray = "xray_assert_hook_shape"
symbol = "xray_assert_hook_shape"

[target.native]
profile = "freestanding"
runtime_provider = "xray-freestanding-hooks-v1"
runtime_capabilities = ["allocator", "panic", "assertion-report"]
runtime_hooks = ["alloc", "free", "panic", "assertion_report"]
