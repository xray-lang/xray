[package]
name = "xray-tests/filetest-ffi-extern-signature-conflict"
version = "1.0.0"
license = "MIT"
main = "ffi_extern_signature_conflict.xr"

[native]
name = "system-libc"
version = "1"
license = "platform"
source = "platform C library"
audit_mode = "exploratory"
vm = "unsupported"

[[native.unit]]
name = "libc"
kind = "platform"
optimization = "none"
visibility = "default"
warnings = "system"
purpose = "resolve audited platform C symbols"

[[native.symbol]]
xray = "task208LabsInt"
native = "labs"
kind = "function"
calling_convention = "c"
unit = "libc"

[[native.symbol]]
xray = "task208LabsFloat"
native = "labs"
kind = "function"
calling_convention = "c"
unit = "libc"
