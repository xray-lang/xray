[package]
name = "tests/freestanding-riscv-qemu-smoke"
version = "1.0.0"
license = "MIT"
main = "freestanding_riscv_uart.xr"

[native]
name = "freestanding-riscv-start"
version = "1.0.0"
license = "MIT"
source = "in-tree freestanding QEMU regression stub"
audit_mode = "shipping"
vm = "unsupported"

[[native.unit]]
name = "riscv-start"
kind = "asm"
sources = ["freestanding_riscv_start.S"]
source_hashes = ["$START_HASH"]
optimization = "release"
visibility = "hidden"
warnings = "strict"
output = "freestanding_riscv_start.o"
purpose = "initialize the machine stack before entering generated Xray code"

[[native.symbol]]
xray = "startupLinked"
native = "xray_startup_linked"
kind = "function"
calling_convention = "c"
unit = "riscv-start"

[native.symbol.contract]
params = []
return = { ownership = "value", nullable = false, validity = "void" }
effects = ["foreign"]
callbacks = []
failure = "none"
allocation = "none"
blocking = "never"
suspend = "never"
io = "none"
sync = "none"
panic = "never"
error = "none"

[[freestanding.entry]]
xray = "kernel_entry"
symbol = "xray_kernel_entry"
kind = "start"
section = ".text.entry"
stub = "freestanding_riscv_start.S"
