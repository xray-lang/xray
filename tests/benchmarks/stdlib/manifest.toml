schema = 1
raw_samples_required = true
minimum_release_repetitions = 5
governed_suites = [
  "stdlib/_probe", "stdlib/base64", "stdlib/cluster", "stdlib/compress", "stdlib/crypto",
  "stdlib/csv", "stdlib/datetime", "stdlib/encoding", "stdlib/http", "stdlib/io",
  "stdlib/log", "stdlib/math", "stdlib/mem", "stdlib/net", "stdlib/os", "stdlib/parallel",
  "stdlib/path", "stdlib/prelude", "stdlib/regex", "stdlib/runtime", "stdlib/strconv",
  "stdlib/sync", "stdlib/sys", "stdlib/test_yield", "stdlib/text", "stdlib/time",
  "stdlib/toml", "stdlib/url", "stdlib/ws", "stdlib/xml", "stdlib/yaml",
]

[[benchmark]]
id = "base64.contract"
module = "base64"
suite = "stdlib/base64"
kind = "cpu_kernel"
source = "tests/diff/cases/semantics/stdlib/base64_module.xr"
warmup = 1
iterations = 5
quick_iterations = 2
metrics = ["wall_ns"]
compare = ["vm", "aot"]
vm_budget_ratio = 30.0

