# --- Task 221 Phase C: benchmark activation for the remaining governed suites ---
# Every governed stdlib suite now has at least one active benchmark, clearing the
# stdlib self-hosting completion gate's `missing_active_benchmarks` blocker
# (22 -> 0). Sources reuse existing deterministic tests/diff semantic cases where
# one exists; the modules without a reusable pure case get minimal, deterministic
# workloads under tests/benchmarks/stdlib/<module>/ (no network, no randomness).
#
# Budgets follow 221 §4 per-class defaults (cpu_kernel 30-80, parser 50,
# tiny_helper 20-50, syscall-dominated 10-20, regex 80). io.path is widened to
# 40 (above the syscall class default) because its filesystem workload
# (tempdir/mkdir/symlink/realpath/removeAll) has high wall-time variance under
# load; per 221 §4 a widened budget is allowed with a recorded reason, and true
# perf tightening is deferred to the 196 §7 P1-P5 analysis.
#
# test_yield requires building xray with -DXR_BUILD_TEST_MODULES=ON; its AOT
# benchmark executes through the internal provider. Runtime control-plane
# benchmarks execute on both backends through the provider-owned current heap.

[[benchmark]]
id = "probe.shapes.contract"
module = "_probe"
suite = "stdlib/_probe"
kind = "tiny_helper"
source = "tests/diff/cases/semantics/stdlib/probe_module_shapes.xr"
warmup = 1
iterations = 5
quick_iterations = 2
metrics = ["wall_ns"]
compare = ["vm", "aot"]
vm_budget_ratio = 50.0

