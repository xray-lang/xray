symbol = "__sleep"
class = "runtime_leaf"
abi = "Xray scheduler timer-wheel suspension and coroutine resumption"
ownership = "none"
effect = "suspends"
provider = "the runtime timer wheel; time.xr owns validation and maximum-duration policy"
deletion_trigger = "none while source-level sleep requires scheduler integration"

[[leaf]]
