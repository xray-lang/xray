symbol = "__cpuNanos"
class = "host_abi_leaf"
abi = "clock_gettime(2) CLOCK_PROCESS_CPUTIME_ID, falling back to clock(3) where that clock id is absent; Win32 GetProcessTimes"
ownership = "none"
effect = "nothrow"
provider = "kernel clock via libc. VM stdlib/time/time.c -> src/os/os_time.h xr_time_process_cpu_ns; AOT src/aot/xrt_time.h xrt_platform_process_cpu_ns, which reuses the same shared clock on a native build and inlines clock_gettime on a cross target"
deletion_trigger = "when Xray source can issue the clock_gettime(2) call itself; the leaf answers the raw counter and applies no policy, so nothing has to move to time.xr first"

[[leaf]]
