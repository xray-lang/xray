# ============================================================================
# os
# ============================================================================
#
# The AOT halves of this module live in `src/aot/xrt_os.h`, a freestanding
# header-only runtime whose helpers are all `static inline`. It does not link
# `src/os/`, so with one exception -- os.__getpid, which both backends reach
# through `src/shared/xr_os_core.h` -- every leaf here has two independent
# implementations. Where they reach different entry points the provider field
# says which.

