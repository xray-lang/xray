# ============================================================================
# net -- sockets, DNS and TLS
# ============================================================================
#
# The VM half (stdlib/net/net.c) and the AOT half (src/aot/xrt_net.h) are two
# independent implementations. They share only the header-only socket shims in
# `src/os/os_net.h` and, under a coroutine, one netpoll instance. Where a leaf
# reaches different syscalls or offers a capability on one backend only, the
# provider field records it; TLS is the largest such split and is filed as
# divergence 3 of blockers/a-stdlib-vm-aot-leaf-semantic-divergence.md.
#
# A third of this module's leaves cross no host ABI at all: they read a field
# of a runtime-owned socket handle, or a per-worker thread-local. Those are
# `runtime_leaf`, because calling them `host_abi_leaf` would claim a syscall
# boundary that is not there.

[[leaf]]
module = "net"
symbol = "__NetError"
class = "native_record_shape_leaf"
abi = "private zero-payload enum with stable ordinal order Timeout, Closed, Reset, Refused, Dns, Tls, Io, Invalid, Cancelled, OutOfMemory"
ownership = "fresh"
effect = "nothrow"
provider = "generated stdlib enum metadata used only by the bidirectional VM/AOT pump error channel; net.xr maps every variant to the source-owned public NetError"
deletion_trigger = "when __copyBidirectional returns a private scalar status or the two source pumps replace the native implementation"

[[leaf]]
module = "net"
symbol = "__CopyBidirectionalResult"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def, exact shape {aToB: i64, bToA: i64}). VM builds it via xr_stdlib_record_class_get(X, \"net\", \"__CopyBidirectionalResult\"); AOT materialises it from the native XrtI64PairResult struct in the coroutine code generator"
deletion_trigger = "when net.__copyBidirectional is deleted, or when a .def entry can declare its return as a type net.xr owns, so the byte-count pair stops needing a native record shape to travel through"

[[leaf]]
module = "net"
symbol = "__accept"
class = "host_abi_leaf"
abi = "accept(2) -- on the Linux io_uring path with SOCK_NONBLOCK, i.e. accept4(2) semantics -- plus fcntl(2) F_SETFL and setsockopt(2) TCP_NODELAY on the accepted descriptor"
ownership = "fresh"
effect = "suspends"
provider = "kernel accept(2); the wait is the Xray netpoll (kqueue/epoll/io_uring/IOCP-AFD) on the VM and, under a coroutine, on AOT too. VM stdlib/net/net.c -> src/coro/xsocket.c xr_socket_accept_try; AOT src/aot/xrt_net.h xrt_net_accept_try under a coroutine and a select(2) wait otherwise"
deletion_trigger = "when Xray source can issue the accept(2) call itself and register the resulting descriptor with the netpoll; the descriptor's non-blocking and TCP_NODELAY setup would move to net.xr at the same time"

[[leaf]]
module = "net"
symbol = "__close"
class = "host_abi_leaf"
abi = "close(2) (Win32 closesocket), preceded on the AOT side by shutdown(2) SHUT_RDWR; netpoll deregistration is epoll_ctl(2) EPOLL_CTL_DEL or kevent(2) EV_DELETE; on the VM a TLS connection first runs OpenSSL SSL_shutdown(3) and SSL_free(3)"
ownership = "none"
effect = "nothrow"
provider = "libc close plus Xray netpoll deregistration, plus OpenSSL on the VM only. VM stdlib/net/net.c -> src/io/xnet_handle.c; AOT src/aot/xrt_net.h -> xr_aot_netpoll_close_fd in src/coro/xaot_runtime.c"
