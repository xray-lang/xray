# ============================================================================
# regex -- the built-in pattern engine
# ============================================================================
#
# Every one of these is `native_engine_leaf` for the same reason compress is:
# `stdlib/regex/` is Xray's own Thompson-simulation engine -- parser, compiler,
# NFA and a lazily-built DFA cache -- with no PCRE, RE2, Oniguruma or POSIX
# regcomp(3) behind it, and no system call other than heap allocation. Both
# backends run the same engine; only the value wrappers differ.
#
# The `Regex` value is a native class (builtin kind XR_BK_REGEX): an XrInstance
# with a native body on the VM, an ARC object with a builtin destructor on AOT.
# That runtime-owned handle is what keeps most of these leaves in C. Two of
# them -- __escape and __isValid -- produce no handle, and their deletion
# triggers name the other reason instead.
#
# `XRT_ENABLE_REGEX`, which the `.def` names on ten of these entries, gates
# only the ARC destructor case in the AOT collections header, not the leaves.
# The AOT driver adds it automatically when a program references any regex
# symbol, so it is dead-code elimination rather than a feature switch.

[[leaf]]
module = "regex"
symbol = "__compile"
class = "native_engine_leaf"
abi = "none; parses and compiles a pattern in process, reaching only malloc(3) and free(3)"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_compile_ex, shared by both backends. It parses into an arena, compiles to a program capped at 10000 instructions, and builds a DFA eagerly when the pattern has no empty-width assertion or Unicode range. The wrappers differ: the VM returns an XrInstance of the Regex native class, AOT an ARC object tagged XR_TAG_REGEX. Two .def entries, one for each arity, share this leaf; the flags string is parsed by src/shared/xr_regex_core.h on both sides"
deletion_trigger = "the engine holds runtime-owned state: a compiled Regex is a native class the runtime knows how to destroy, and its DFA cache is written during matching. The leaf can go when Xray can own that handle -- declare the compiled program as an Xray type with a destructor -- at which point the whole module's leaves move together"

[[leaf]]
module = "regex"
symbol = "__count"
class = "native_engine_leaf"
abi = "none; matches in process with no allocation at all"
ownership = "none"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_count, shared by both backends: it tries the DFA first and falls back to the NFA simulation when the DFA exceeds its 8 MB or 10000-state budget"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__escape"
class = "native_engine_leaf"
abi = "none at all; it does not even enter the engine. A character-class test and one buffer copy"
ownership = "fresh"
effect = "nothrow"
provider = "src/shared/xr_regex_core.h xr_regex_core_escape, which both backends call -- AOT inlines it from the header without a call at all. It is the only regex leaf that touches neither the parser nor a Regex handle"
deletion_trigger = "rewriting it would fork a shared definition: the set of characters it escapes has to stay identical to the set the parser treats as special, and an Xray copy in regex.xr would be free to drift from it. The leaf goes when the metacharacter set is stated once somewhere both the parser and Xray source can read -- this is the nearest-term deletion in the module, since nothing about the handle or the data representation is in its way"

[[leaf]]
module = "regex"
symbol = "__findGroup"
class = "native_engine_leaf"
abi = "none; matches in process, reaching only malloc(3) for the result string"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_match, shared by both backends. Capture groups force the NFA path, since the DFA does not track submatches. The VM interns the result string; AOT allocates and copies it"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__findText"
class = "native_engine_leaf"
abi = "none; matches in process, reaching only malloc(3) for the result string"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_match through xr_regex_match_at, shared by both backends and running on the NFA simulation"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__isValid"
class = "native_engine_leaf"
abi = "none; runs the pattern parser and discards the result, reaching only malloc(3) for the parse arena"
ownership = "none"
effect = "nothrow"
provider = "stdlib/regex/xregex_parse.c xr_regex_parse. The shell around it is written twice -- stdlib/regex/xregex.c xr_regex_is_valid on the VM and src/aot/xrt_regex_core.c xrt_regex_is_valid_core on AOT, which needs a NUL-terminated copy of its slice first -- so the parser is shared but the validity judgement has two authors"
deletion_trigger = "rewriting it would fork a shared definition: validity means \"this parser accepts it\", so an Xray reimplementation would be a second grammar. The leaf goes when the parser itself is expressible in Xray, or when a compile that reports its failure makes a separate validity question unnecessary"

[[leaf]]
module = "regex"
symbol = "__replace"
class = "native_engine_leaf"
abi = "none; matches and rebuilds a string in process, reaching only malloc(3)"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_replace_alloc, shared by both backends. On the rare allocation-failure path the VM answers the original string and AOT answers null -- a difference confined to that path, since \"no match\" returns a copy of the input on both"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__replaceAll"
class = "native_engine_leaf"
abi = "none; matches and rebuilds a string in process, reaching only malloc(3)"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_replace_alloc with the all flag set, shared by both backends"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__split"
class = "native_engine_leaf"
abi = "none; matches in process, reaching only malloc(3) for the result array"
ownership = "fresh"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_split, shared by both backends. Two .def entries, one for each arity, share this leaf; both cap the result at the 256 parts src/shared/xr_regex_core.h states, so the VM's heap buffer and the AOT's fixed stack array cannot diverge"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

[[leaf]]
module = "regex"
symbol = "__test"
class = "native_engine_leaf"
abi = "none; matches in process with no allocation at all"
ownership = "none"
effect = "nothrow"
provider = "stdlib/regex/xregex.c xr_regex_test, shared by both backends: the DFA first, falling back to the NFA simulation when the DFA exceeds its budget"
deletion_trigger = "the engine holds runtime-owned state: this leaf reads a compiled Regex handle the runtime owns. It goes when regex.__compile goes"

# ============================================================================
# runtime -- reclamation-domain introspection
# ============================================================================
#
# None of these crosses a host ABI. They read counters the runtime maintains,
# and their AOT bindings are `xr_aot_runtime_*` in `src/coro/xaot_runtime.c`
# rather than an `xrt_*` helper: the code generator special-cases them by name
# instead of routing them through the AOT method table.

[[leaf]]
module = "runtime"
symbol = "__RuntimeStats"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def, exact shape with liveBytes, liveObjects, finalizerCount, blocks, freeBlocks and fullBlocks). VM instantiates the generated record class; AOT interns an object shape in the code generator and sets the six fields positionally. The field order agrees; the shape carriers do not"
deletion_trigger = "when runtime.__stats is deleted, or when a .def entry can declare its return as a type runtime.xr owns, so the six counters stop needing a native record shape"

[[leaf]]
module = "runtime"
symbol = "__liveBytes"
class = "runtime_leaf"
abi = "none; reads a live-byte counter"
ownership = "none"
effect = "nothrow"
provider = "the reclamation domain. The VM reads xr_coro_ensure_heap(coro)->totalbytes; AOT (src/coro/xaot_runtime.c xr_aot_runtime_live_bytes) prefers the execution arena's live_bytes and falls back to that same coroutine-heap counter only when the arena is absent, so the two are not always the same counter"
deletion_trigger = "when the reclamation domain's counters are readable from Xray source, which needs the runtime to expose the domain as a value rather than as ambient per-coroutine state"

[[leaf]]
module = "runtime"
symbol = "__liveObjects"
class = "runtime_leaf"
abi = "none; reads a live-object counter"
ownership = "none"
effect = "nothrow"
provider = "the reclamation domain. The VM reads heap->object_count; AOT (src/coro/xaot_runtime.c xr_aot_runtime_live_objects) prefers the execution arena's live_objects with the same fallback as __liveBytes"
deletion_trigger = "when the reclamation domain's counters are readable from Xray source, which needs the runtime to expose the domain as a value rather than as ambient per-coroutine state"

[[leaf]]
module = "runtime"
symbol = "__sharedLiveBytes"
class = "runtime_leaf"
abi = "none; a relaxed atomic load of a process-wide counter"
ownership = "none"
effect = "nothrow"
provider = "src/runtime/mem/xsystem_heap.c xr_sysheap_shared_live_bytes_total. Both backends call it: the AOT wrapper ignores its context argument and forwards to the same function"
deletion_trigger = "when the system heap's shared-object counter is readable from Xray source; it is process-wide state with no coroutine-local form, so it needs a runtime surface of its own"

[[leaf]]
module = "runtime"
symbol = "__staticAllocBytes"
class = "runtime_leaf"
abi = "none; a relaxed atomic load of a process-wide counter"
ownership = "none"
effect = "nothrow"
provider = "src/runtime/mem/xsystem_heap.c xr_sysheap_static_alloc_bytes_total. Both backends call it; the AOT wrapper forwards directly"
deletion_trigger = "when the module-static arena's counter is readable from Xray source; it is process-wide state with no coroutine-local form, so it needs a runtime surface of its own"

[[leaf]]
module = "runtime"
symbol = "__stats"
class = "runtime_leaf"
abi = "none; one pass over the reclamation domain's counters"
ownership = "fresh"
effect = "nothrow"
provider = "the reclamation domain. The VM reads totalbytes, object_count and finalizer_count and then xr_region_get_stats for the block counts; AOT (src/coro/xaot_runtime.c xr_aot_runtime_info) fills only the first three from the execution arena and leaves blocks, freeBlocks and fullBlocks at zero unless it takes the coroutine-heap fallback"
deletion_trigger = "when the individual counters are readable from Xray source, so runtime.xr can assemble the snapshot itself and choose which fields it wants -- which also removes the AOT path's three permanently-zero fields"

# ============================================================================
# sys -- processes, pipes, signals and dynamic libraries
# ============================================================================
#
# As with os, the AOT halves are freestanding `static inline` helpers in
# `src/aot/xrt_sys.h` that do not link `src/os/`. Four leaves here park the
# coroutine on the VM and block the OS thread on AOT; that is recorded per
# leaf, because a leaf with two concurrency behaviours cannot be reduced to one
# Xray body until they agree.

[[leaf]]
module = "sys"
symbol = "__dylibClose"
class = "host_abi_leaf"
abi = "dlclose(3); Win32 FreeLibrary"
ownership = "none"
effect = "nothrow"
provider = "the dynamic linker via libc. VM stdlib/sys/sys.c -> src/os/unix/dylib_unix.c xr_dylib_close, which returns void so the VM always answers true; AOT src/aot/xrt_sys.h returns dlclose's own result. The return values mean different things"
deletion_trigger = "when the two backends agree on whether the return reports the unload result, and Xray source can issue the dlclose(3) call itself"

[[leaf]]
module = "sys"
symbol = "__dylibLastError"
class = "host_abi_leaf"
abi = "dlerror(3) on the VM; on AOT no call at all -- it reads a thread-local buffer the open/symbol/close wrappers filled, using FormatMessageA on Windows"
ownership = "fresh"
effect = "nothrow"
provider = "libc on the VM (src/os/unix/dylib_unix.c, a bare dlerror whose one-shot result another caller can consume first) and an XR_THREAD_LOCAL char buffer in src/aot/xrt_sys.h on AOT. The mechanisms are unrelated"
deletion_trigger = "when a failing dylib leaf returns its error text in its own result, so neither a one-shot dlerror nor a thread-local buffer has to carry it between two calls"

[[leaf]]
module = "sys"
symbol = "__dylibOpen"
class = "host_abi_leaf"
abi = "dlopen(3) with RTLD_NOW|RTLD_LOCAL; Win32 LoadLibraryA"
ownership = "none"
effect = "nothrow"
provider = "the dynamic linker via libc. VM stdlib/sys/sys.c -> src/os/unix/dylib_unix.c xr_dylib_open; AOT src/aot/xrt_sys.h carries its own copy"
deletion_trigger = "when Xray source can issue the dlopen(3) call itself; loading a foreign image is the boundary and has no smaller form"

[[leaf]]
module = "sys"
symbol = "__dylibSymbol"
class = "host_abi_leaf"
abi = "dlerror(3) to clear, then dlsym(3); Win32 GetProcAddress"
ownership = "none"
effect = "nothrow"
provider = "the dynamic linker via libc. VM stdlib/sys/sys.c -> src/os/unix/dylib_unix.c xr_dylib_sym; AOT src/aot/xrt_sys.h carries its own copy"
deletion_trigger = "when Xray source can issue the dlsym(3) call itself; the clear-then-lookup pair is one query, because dlsym reports failure only through dlerror"

[[leaf]]
module = "sys"
symbol = "__onSignal"
class = "host_abi_leaf"
abi = "sigaction(2) with sigemptyset(3), restricted to SIGTERM and SIGINT; Win32 signal(3)"
ownership = "none"
effect = "nothrow"
provider = "the kernel installs the handler, but delivery is the Xray runtime's. The VM spawns a dedicated C-function coroutine that polls the pending bits on the timer wheel every 10 ms and calls the closure; AOT stores the closure in a global slot whose pending bits are only consumed inside threadYield, sleepMs and pinToCpu, so an AOT program that calls none of those may never run the handler"
deletion_trigger = "when signal delivery is a scheduler surface both backends share -- a channel or an awaitable the runtime posts to -- so sys.xr can receive signals instead of registering a C-side callback"

[[leaf]]
module = "sys"
symbol = "__osMutexNew"
class = "host_abi_leaf"
abi = "pthread_mutex_init(3); Win32 InitializeSRWLock"
ownership = "fresh"
effect = "nothrow"
provider = "the pthreads implementation in libc. VM stdlib/sys/sys.c builds an instance whose native body calls src/os/unix/thread_unix.c xr_mutex_init; AOT src/aot/xrt_sys.h allocates a refcounted cell and calls pthread_mutex_init directly. Same entry point, different host objects"
deletion_trigger = "when the runtime offers an OS mutex as a typed handle Xray source can hold, so the initialisation and the object it lives in are not decided inside one native call"

[[leaf]]
module = "sys"
symbol = "__pipeClose"
class = "host_abi_leaf"
abi = "close(2); Win32 CloseHandle"
ownership = "none"
effect = "nothrow"
provider = "the kernel. VM stdlib/sys/sys.c -> src/os/unix/pipe_unix.c xr_pipe_close; AOT src/aot/xrt_sys.h xrt_sys_pipe_close_handle carries its own copy"
deletion_trigger = "when the runtime offers a typed descriptor handle whose release Xray source can express, which is the same capability blockers/a-stdlib-no-write-side-file-descriptor-leaf.md asks for on the io side"

[[leaf]]
module = "sys"
symbol = "__pipeOpen"
class = "host_abi_leaf"
abi = "pipe(2) plus fcntl(2) F_GETFD/F_SETFD to set FD_CLOEXEC; Win32 CreatePipe"
ownership = "fresh"
effect = "nothrow"
provider = "the kernel. VM stdlib/sys/sys.c -> src/os/unix/pipe_unix.c xr_pipe_create; AOT src/aot/xrt_sys.h xrt_sys_pipe_create carries its own copy"
deletion_trigger = "when Xray source can issue the pipe(2) call itself; the FD_CLOEXEC step has to stay attached to the creation, because splitting it reintroduces the fork race it exists to close"

[[leaf]]
module = "sys"
symbol = "__pipeRead"
class = "host_abi_leaf"
abi = "read(2); the VM additionally uses fcntl(2) to set O_NONBLOCK for the attempt and restore the original flags afterwards"
ownership = "fresh"
effect = "suspends"
provider = "the kernel read, plus the Xray scheduler on the VM: stdlib/sys/sys.c retries through xr_pipe_try_read and yields for 1 ms on EAGAIN, except on Windows where it degrades to a blocking read. AOT src/aot/xrt_sys.h blocks unconditionally"
deletion_trigger = "when a pipe descriptor can be registered with the netpoll and awaited from Xray source, so the retry loop is Xray code and the AOT half stops blocking its worker"

[[leaf]]
module = "sys"
symbol = "__pipeWrite"
class = "host_abi_leaf"
abi = "write(2); the VM additionally uses fcntl(2) to set O_NONBLOCK for the attempt and restore the original flags afterwards"
ownership = "none"
effect = "suspends"
provider = "the kernel write, plus the Xray scheduler on the VM (stdlib/sys/sys.c, yielding for 1 ms on EAGAIN). AOT src/aot/xrt_sys.h blocks unconditionally"
deletion_trigger = "when a pipe descriptor can be registered with the netpoll and awaited from Xray source, so the retry loop is Xray code and the AOT half stops blocking its worker"

[[leaf]]
module = "sys"
symbol = "__processKill"
class = "host_abi_leaf"
abi = "kill(2); Win32 TerminateProcess"
ownership = "none"
effect = "nothrow"
provider = "the kernel. VM stdlib/sys/sys.c -> src/os/unix/proc_unix.c xr_proc_kill, which signals the whole process group with kill(-pid) for a detached child; AOT src/aot/xrt_sys.h has no negative-pid branch, so it signals only the child"
deletion_trigger = "when the two backends agree on whether a detached child is signalled as a group, and Xray source can issue the kill(2) call itself"

[[leaf]]
module = "sys"
symbol = "__processSpawn"
class = "host_abi_leaf"
abi = "fork(2), then dup2(2), chdir(2), setenv(3), execvp(3) and waitpid(2); a detached spawn adds pipe(2), setsid(2) and a second fork(2). Win32 uses the CreateProcessW family. It is a hand-written fork/exec, not posix_spawn(3)"
ownership = "none"
effect = "nothrow"
provider = "kernel process syscalls. VM stdlib/sys/sys.c -> src/os/unix/proc_unix.c xr_proc_spawn_ex; AOT src/aot/xrt_sys.h xrt_sys_process_spawn is an independent copy of the same sequence"
deletion_trigger = "when Xray source can run code between fork(2) and execvp(3) -- the redirections, the directory change and the environment writes all happen in the child, where allocating or calling back into the runtime is not safe. Until then the sequence cannot be split"

[[leaf]]
module = "sys"
symbol = "__processTryWait"
class = "host_abi_leaf"
abi = "waitpid(2) with WNOHANG; Win32 WaitForSingleObject with a zero timeout plus GetExitCodeProcess"
ownership = "none"
effect = "nothrow"
provider = "the kernel. VM stdlib/sys/sys.c -> src/os/unix/proc_unix.c xr_proc_try_wait; AOT src/aot/xrt_sys.h carries its own copy"
deletion_trigger = "when Xray source can issue the waitpid(2) call itself; the non-blocking poll is already the minimal form of this boundary"

[[leaf]]
module = "sys"
symbol = "__processWait"
class = "host_abi_leaf"
abi = "waitpid(2); the VM normally passes WNOHANG and polls, while AOT blocks in a plain waitpid. Win32 _cwait"
ownership = "none"
effect = "suspends"
provider = "the kernel wait, plus the Xray scheduler on the VM: stdlib/sys/sys.c loops over xr_proc_try_wait and yields for 1 ms, falling back to a blocking wait only where it cannot yield. AOT src/aot/xrt_sys.h blocks the worker for the child's lifetime -- divergence 4 of blockers/a-stdlib-vm-aot-leaf-semantic-divergence.md"
deletion_trigger = "when child exit is an awaitable the scheduler posts to on both backends, so sys.xr can write the wait as a suspension over __processTryWait instead of the C side choosing between polling and blocking"

[[leaf]]
module = "sys"
symbol = "__threadLocalAlive"
class = "runtime_leaf"
abi = "none; a lookup in the runtime's live-id table under a spinlock, whose backoff uses sched_yield(3) or Sleep(0)"
ownership = "none"
effect = "nothrow"
provider = "the Xray runtime's own registry. VM src/coro/xthread_obj.c xr_thread_obj_threadlocal_id_alive; AOT src/aot/xrt_sys.h xrt_sys_thread_local_alive. Two independent registries; both answer true on allocation failure"
deletion_trigger = "when the thread-local registry is one surface both backends share and Xray source can query it; today the two id spaces are disjoint, so the same program can get different answers"

[[leaf]]
module = "sys"
symbol = "__threadLocalId"
class = "runtime_leaf"
abi = "none; reads a thread-local slot and an atomically incremented counter. The C11 _Thread_local ABI is the compiler's, not pthread_key_create(3)"
ownership = "none"
effect = "nothrow"
provider = "the Xray runtime's own registry. VM src/coro/xthread_obj.c xr_thread_obj_threadlocal_current_id; AOT src/aot/xrt_sys.h xrt_threadlocal_current_id. Two independent registries whose id spaces do not agree"
deletion_trigger = "when the thread-local registry is one surface both backends share and Xray source can query it"

# ============================================================================
# time
# ============================================================================
#
# All four leaves read a clock. `time.__utcOffsetAt` is the only leaf in the
# whole allowlist whose VM and AOT halves call the same function.

[[leaf]]
module = "time"
symbol = "__cpuNanos"
class = "host_abi_leaf"
abi = "clock_gettime(2) CLOCK_PROCESS_CPUTIME_ID, falling back to clock(3) where that clock id is absent; Win32 GetProcessTimes"
ownership = "none"
effect = "nothrow"
provider = "kernel clock via libc. VM stdlib/time/time.c -> src/os/os_time.h xr_time_process_cpu_ns; AOT src/aot/xrt_time.h xrt_platform_process_cpu_ns, which reuses the same shared clock on a native build and inlines clock_gettime on a cross target"
deletion_trigger = "when Xray source can issue the clock_gettime(2) call itself; the leaf answers the raw counter and applies no policy, so nothing has to move to time.xr first"

[[leaf]]
module = "time"
symbol = "__monotonicNanos"
class = "host_abi_leaf"
abi = "clock_gettime(2) CLOCK_MONOTONIC; Win32 QueryPerformanceCounter"
ownership = "none"
effect = "nothrow"
provider = "kernel clock via libc, but through different paths: the VM calls src/coro/xworker.c xr_runtime_current_monotonic_ns, which returns the runtime's virtual tick under deterministic mode, while AOT calls src/aot/xrt_time.h xrt_platform_monotonic_ns and always reads the real clock. Deterministic mode therefore exists on the VM only"
deletion_trigger = "when deterministic mode is expressible on both backends -- until then the leaf is the only place the virtual clock can be substituted -- and Xray source can issue the clock_gettime(2) call itself"

[[leaf]]
module = "time"
symbol = "__realtimeNanos"
class = "host_abi_leaf"
abi = "clock_gettime(2) CLOCK_REALTIME; Win32 GetSystemTimePreciseAsFileTime"
ownership = "none"
effect = "nothrow"
provider = "kernel clock via libc. VM stdlib/time/time.c -> src/os/os_time.h xr_time_realtime_ns; AOT src/aot/xrt_time.h xrt_platform_realtime_ns, sharing the same implementation on a native build and inlining clock_gettime on a cross target"
deletion_trigger = "when Xray source can issue the clock_gettime(2) call itself; the leaf answers nanoseconds and applies no policy, so the epoch and unit choices already live in time.xr"

[[leaf]]
module = "time"
symbol = "__utcOffsetAt"
class = "host_abi_leaf"
abi = "localtime_r(3) and gmtime_r(3), then mktime(3) and difftime(3) over the two broken-down times; Win32 localtime_s and gmtime_s"
ownership = "none"
effect = "nothrow"
provider = "libc, reading the process-global time-zone state that tzset(3) installs. Both backends call the same function -- xr_time_utc_offset_at in src/shared/xr_time_offset.h -- which makes this the one leaf here with a single implementation"
deletion_trigger = "when Xray gains a time-zone database surface, so the local-minus-UTC delta can be computed in time.xr instead of through the C library's process-global TZ state"
