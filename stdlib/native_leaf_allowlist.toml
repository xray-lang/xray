# Per-symbol allowlist of accepted private native leaves.
#
# `scripts/stdlib_symbol_inventory.py` writes the authoritative `leaf_class`
# column from this file and nothing else. A leaf with no record here stays
# `unclassified` and keeps failing `stdlib_native_leaf_allowlist`, so the file
# is the place a native C boundary is accepted -- not a description of one that
# was accepted somewhere else.
#
# Each record answers five questions:
#
#   class            which boundary the leaf crosses, from the closed set in
#                    `scripts/stdlib_symbol_inventory.py:LEAF_CLASSES`. The
#                    class says what kind of boundary this is; it does not
#                    claim the boundary is minimal or permanent.
#   abi              the external entry point the leaf ultimately reaches,
#                    named precisely enough to look up. "none" spells out a
#                    leaf that crosses no host ABI at all.
#   ownership        what the return does with ownership. When the `.def`
#                    entry declares `return_ownership`, this must repeat it
#                    verbatim -- the declaration is the authority, and the
#                    inventory rejects a record that contradicts it.
#   effect           comma-separated tokens from `LEAF_EFFECT_TOKENS`, plus
#                    any `Enum.Variant` the `.def` entry declares it raises. A
#                    leaf the `.def` binds as `yieldable` must carry
#                    `suspends`. `nothrow` is exclusive.
#   deletion_trigger the decidable condition under which this leaf can be
#                    deleted. It has to be checkable by reading the repository
#                    or by asking whether a named capability exists -- never a
#                    schedule and never an intention.
#
# A record is keyed by the (module, symbol) pair rather than by one dotted
# string, because a class-method symbol already carries a dot and splitting it
# back apart would be guesswork. One record covers every `.def` entry with that
# name, which is what an arity overload is: `os.__kill`, `regex.__compile` and
# `regex.__split` each have two entries over one leaf, and the boundary they
# cross does not change with the argument count. A second record for the same
# pair is refused rather than resolved by file order.
#
# The distinction that makes `deletion_trigger` load-bearing: several leaves
# below cross a host ABI through a loop or a branch that belongs in Xray. Their
# class is honest about which boundary they cross; their deletion trigger names
# the capability gap that keeps the loop in C. `analysis/a-stdlib-native-leaf-
# dossier.md` records which of them are not minimal boundaries.

schema = 1

# ============================================================================
# cluster -- the distributed-node runtime
# ============================================================================
#
# Five of these ten leaves have no `aot:` binding at all. That is not a
# fallback: the code generator fails the compilation with "unsupported AOT
# stdlib call" when a reachable call site needs one, so a program that touches
# cluster.self(), nodes(), discover(), info() or monitor() cannot be compiled
# ahead of time. Their deletion triggers say so, because "add the missing
# binding" is a decidable condition and a real prerequisite for this module.

[[leaf]]
module = "cluster"
symbol = "__ClusterTlsSnapshot"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def). The VM fills it from the cluster TLS runtime state before cluster.xr constructs the public ClusterTlsStatus value; there is no AOT binding"
deletion_trigger = "when cluster runtime state is exposed through scalar accessor leaves, so cluster.xr can assemble the TLS snapshot without a native record class"

[[leaf]]
module = "cluster"
symbol = "__ClusterNodeSnapshot"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def). The VM fills it from one runtime-owned cluster node before cluster.xr constructs the public ClusterNodeInfo value; there is no AOT binding"
deletion_trigger = "when the cluster node table and counters are exposed through scalar accessor leaves, so cluster.xr can assemble each node snapshot without a native record class"

[[leaf]]
module = "cluster"
symbol = "__ClusterSnapshot"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def). The VM fills it from runtime-owned cluster state before cluster.xr constructs the public ClusterInfo value; there is no AOT binding"
deletion_trigger = "when cluster runtime state is exposed through scalar accessor leaves, so cluster.xr can assemble the diagnostic snapshot without a native record class"

[[leaf]]
module = "cluster"
symbol = "__discover"
class = "host_abi_leaf"
abi = "socket(2) AF_INET/SOCK_DGRAM, bind(2), setsockopt(2) IP_ADD_MEMBERSHIP / IP_MULTICAST_TTL / IP_MULTICAST_LOOP (IP_DROP_MEMBERSHIP on stop), sendto(2) and recvfrom(2)"
ownership = "none"
effect = "nothrow"
provider = "kernel multicast sockets, driven by a native yieldable coroutine on the Xray netpoll. VM stdlib/cluster/cluster_discovery.c create_mcast_socket/cluster_discovery_start. There is no AOT binding: the code generator refuses a reachable call"
deletion_trigger = "when cluster.xr can open a multicast socket over net's own leaves and run the announce/listen loop itself, which needs net to expose setsockopt(2) for the multicast options it currently does not"

[[leaf]]
module = "cluster"
symbol = "__info"
class = "runtime_leaf"
abi = "none; reads cluster runtime state under its own mutexes and atomics"
ownership = "fresh"
effect = "nothrow"
provider = "the cluster runtime's own state (stdlib/cluster/cluster.c cluster_info_fn): the node tables under nodes_lock/dead_nodes_lock, relaxed atomic counters, and whether the TLS contexts are non-NULL. It does not call OpenSSL. There is no AOT binding"
deletion_trigger = "when the cluster runtime's node tables and counters are reachable from cluster.xr through smaller accessor leaves; this leaf currently returns only private __Cluster*Snapshot records and cluster.xr alone maps them into the public ClusterInfo graph"

[[leaf]]
module = "cluster"
symbol = "__join"
class = "host_abi_leaf"
abi = "getaddrinfo(3), socket(2), non-blocking connect(2), getsockopt(2) SO_ERROR, send/recv; OpenSSL SSL_do_handshake(3) when TLS is on; the platform CSPRNG for the handshake nonce"
ownership = "none"
effect = "suspends"
provider = "kernel connect(2) plus, on the VM, the Xray netpoll for the wait and OpenSSL for the handshake (stdlib/cluster/cluster.c cluster_join). AOT (stdlib/cluster/cluster_aot.c xrt_cluster_join) uses a blocking connect(2) with a select(2) timeout, two OS threads per node, no netpoll and no TLS. The leaf takes a host and a port, not an address: the grammar is parseAddress in cluster.xr, which both backends compile, and neither half parses one any more"
deletion_trigger = "when cluster.xr can reach a peer over net.__connectFd and net.__tlsHandshake instead of the module's own socket path, which needs the multi-module program authority tracked in blockers/a-stdlib-multi-module-program-authority.md"

[[leaf]]
module = "cluster"
symbol = "__listen"
class = "runtime_leaf"
abi = "none; constructs a bounded channel and registers a topic subscription"
ownership = "fresh"
effect = "nothrow"
provider = "the Xray channel subsystem (src/coro/xchannel.c), reached through cluster_transport_listen on the VM and xrt_cluster_listen on AOT. The channel itself is shared; the subscription table is a trie on the VM and a linked list on AOT. What counts as a legal pattern, and what capacity may be asked for, are cluster.xr's listen(): the three copies of those two rules -- the VM binding, the VM transport and the AOT entry point -- are gone"
deletion_trigger = "when cluster.xr can construct a Channel and register a topic pattern directly, which needs the channel constructor and the topic table to be surfaces Xray source can name"

[[leaf]]
module = "cluster"
symbol = "__monitorNode"
class = "runtime_leaf"
abi = "none; constructs a bounded channel and registers one normalized node-down target"
ownership = "fresh"
effect = "nothrow"
provider = "the Xray channel subsystem and the cluster runtime's node-monitor registry, driven by stdlib/cluster/cluster_monitor.c. cluster.xr validates the node target and chooses this exact leaf rather than exposing an arity-based native dispatcher. There is no AOT binding"
deletion_trigger = "when the cluster monitor registry and Channel constructor are surfaces Xray source can name"

[[leaf]]
module = "cluster"
symbol = "__monitorCoroutine"
class = "runtime_leaf"
abi = "none; constructs a bounded channel, registers one normalized remote-coroutine target and enqueues its monitor frame"
ownership = "fresh"
effect = "nothrow"
provider = "the Xray channel subsystem plus the coroutine registry (src/coro/xcoro_registry.h xr_coro_monitor), driven by stdlib/cluster/cluster_monitor.c. cluster.xr validates both names and chooses this exact leaf rather than exposing an arity-based native dispatcher. There is no AOT binding"
deletion_trigger = "when the coroutine registry, cluster writer queue and Channel constructor are surfaces Xray source can name"

[[leaf]]
module = "cluster"
symbol = "__nodes"
class = "runtime_leaf"
abi = "none; reads the node table under nodes_lock and interns the names"
ownership = "fresh"
effect = "nothrow"
provider = "the cluster runtime's own state (stdlib/cluster/cluster.c cluster_nodes), allocating the result array on the coroutine heap. There is no AOT binding"
deletion_trigger = "when the cluster runtime's node table is reachable from cluster.xr through a smaller accessor leaf, so building the name array stops being a C-side operation"

[[leaf]]
module = "cluster"
symbol = "__self"
class = "runtime_leaf"
abi = "none; reads the node's own configured name"
ownership = "fresh"
effect = "nothrow"
provider = "the cluster runtime's own state (stdlib/cluster/cluster.c cluster_self), returning an interned string. There is no AOT binding"
deletion_trigger = "when cluster.xr holds the node name it passed to cluster.__start rather than reading it back out of the C runtime -- which needs module-level state that survives across calls, the same capability blockers/a-stdlib-module-const-from-native-leaf.md is about"

[[leaf]]
module = "cluster"
symbol = "__send"
class = "runtime_leaf"
abi = "none on the sending call itself: it moves buffer ownership, matches the topic trie and enqueues. The only host call is a write(2) on the node's notify pipe; the network bytes leave later on a writer coroutine"
ownership = "none"
effect = "nothrow"
provider = "the cluster transport's own queues and the Xray channel subsystem. VM stdlib/cluster/cluster_topic.c cluster_transport_send; AOT stdlib/cluster/cluster_aot.c xrt_cluster_send, an independent lock-and-list implementation over OS threads. The leaf returns only a private integer code; cluster.xr alone maps it to ClusterDelivery. The two providers still share the topic matching in cluster_topic_core.h and the frame encoding in cluster_proto.c. One divergence is left and is not this leaf's to close: the VM re-forwards a received envelope to every other peer with the hop count decremented (cluster_topic.c cluster_transport_handle_frame) while the AOT reader delivers locally and never reads the hop byte at all (cluster_aot.c aot_cluster_process_transport), so a three-node chain reaches its far end on one backend and not the other"
deletion_trigger = "when the topic table and the per-node outbound queue are surfaces Xray source can name, so cluster.xr can do the match and the enqueue itself"

[[leaf]]
module = "cluster"
symbol = "__start"
class = "runtime_leaf"
abi = "socket(2), setsockopt(2) SO_REUSEADDR and IPV6_V6ONLY, bind(2), listen(2) for the node listener; OpenSSL SSL_CTX_new(3)/SSL_CTX_set_min_proto_version(3)/SSL_CTX_load_verify_locations(3) when TLS is on, plus CertOpenSystemStoreW on Windows"
ownership = "none"
effect = "nothrow"
provider = "the Xray scheduler, which the leaf asks to publish the heartbeat and accept coroutines, over a listener from src/io/xnet_transport.c xr_io_listen and a TLS context from src/io/xtls_provider.c. AOT (stdlib/cluster/cluster_aot.c xrt_cluster_start) discards all six TLS arguments and returns false outright when tlsEnabled is set, and runs its accept loop on an OS thread instead. The node name, the port range and the heartbeat schedule are cluster.xr's: start() refuses an illegal name or port before the leaf is reached, and passes HEARTBEAT_INTERVAL_MS, HEARTBEAT_TIMEOUT_MS and MAX_MISSED_HEARTBEATS down rather than letting each backend default them"
deletion_trigger = "when cluster.xr can publish its own coroutines and build its own listener over net's leaves, and the AOT half stops declining TLS so both backends start the same node"

[[leaf]]
module = "cluster"
symbol = "__stop"
class = "runtime_leaf"
abi = "close(2) on the listener and the notify pipe, setsockopt(2) IP_DROP_MEMBERSHIP, OpenSSL SSL_CTX_free(3), and a secure wipe of the shared secret (memset_s / explicit_bzero / a volatile loop)"
ownership = "none"
effect = "nothrow"
provider = "the cluster runtime's own teardown: channel close and coroutine join on the VM (stdlib/cluster/cluster.c cluster_runtime_stop), service-slot removal and thread join on AOT (stdlib/cluster/cluster_aot.c)"
deletion_trigger = "when cluster.xr owns the coroutines and the listener it started, so stopping them is ordinary Xray teardown; the secret wipe would still need a leaf, because Xray cannot promise the compiler will not elide a zeroing store"

# ============================================================================
# crypto
# ============================================================================

[[leaf]]
module = "crypto"
symbol = "__randomBytes"
class = "security_provider_leaf"
abi = "Linux getrandom(2), retried on EINTR, falling back to reading /dev/urandom and aborting if that also fails; macOS and BSD arc4random_buf(3); Windows BCryptGenRandom with BCRYPT_USE_SYSTEM_PREFERRED_RNG"
ownership = "fresh"
effect = "nothrow"
provider = "the platform CSPRNG through src/os/os_random.h xr_random_bytes (src/os/unix/random_unix.c, src/os/win/random_win.c). Both backends call that same function -- src/aot/xrt_crypto.h includes os_random.h directly -- and differ only in which allocator carries the result array"
deletion_trigger = "never on security grounds: a CSPRNG reimplemented in Xray would replace an audited kernel entropy source with unaudited code. The leaf changes only when the platform's entropy interface changes"

[[leaf]]
module = "crypto"
symbol = "__timingSafeEqualBytes"
class = "security_provider_leaf"
abi = "none; a hand-written constant-time comparison, not OpenSSL CRYPTO_memcmp(3)"
ownership = "none"
effect = "nothrow"
provider = "src/shared/xr_crypto_core.h xr_crypto_core_timing_safe_equal, a static inline both backends call. It ORs the per-byte differences into a volatile accumulator so no branch can leak where the buffers diverge. The VM additionally checks the element type is u8"
deletion_trigger = "when Xray can express a comparison the optimiser is forbidden to short-circuit; until the language can state that constraint, an Xray body would be free to return early on the first differing byte and would silently stop being constant-time"

# ============================================================================
# http2
# ============================================================================
#
# The HTTP/2 protocol stack is entirely Xray's own and now lives in Xray:
# HPACK with the RFC 7541 static table and Huffman codes, the frame layer,
# flow control and the stream state machine are all in `stdlib/http2/http2.xr`.
# What is left in C is the socket underneath them -- opening a TLS connection
# for the ALPN protocol selected by http2.xr, and moving one opaque byte chunk
# across it. These four leaves know nothing about HTTP/2; they would serve any
# protocol. AOT has no TLS transport provider, so it deliberately has no fake
# connect/send/recv/close bindings.

[[leaf]]
module = "http2"
symbol = "__connect"
class = "host_abi_leaf"
abi = "getaddrinfo(3), socket(2), connect(2), setsockopt(2) and close(2) through stdlib/net, plus OpenSSL SSL_connect(3) and SSL_get0_alpn_selected(3)"
ownership = "none"
effect = "suspends"
provider = "the kernel and OpenSSL. VM stdlib/http2/http2_binding.c h2_connect opens one XrIOConn through xr_io_connect_tls_with_ctx and adapts the caller-selected ALPN string to OpenSSL's length-prefixed ABI. It returns -1 for transport failure, -2 when TLS is absent, and -3 when the peer selects another protocol; http2.xr alone maps those raw outcomes to typed errors. A positive integer names a generation-checked slot in per-isolate stdlib state, so no address crosses into Xray. No AOT provider exists"
deletion_trigger = "when net exposes a TLS connect that accepts an ALPN protocol and returns the negotiated result through its ordinary source-owned connection surface"

[[leaf]]
module = "http2"
symbol = "__send"
class = "host_abi_leaf"
abi = "one write(2) / OpenSSL SSL_write(3) through stdlib/net's XrIOConn, suspending on the netpoll when the socket is not writable"
ownership = "none"
effect = "suspends"
provider = "the kernel and OpenSSL. VM stdlib/http2/http2_binding.c h2_send performs one TLS write from a source-selected offset and returns the accepted byte count. The partial-write drain loop and no-progress failure policy live in http2.xr. No AOT provider exists"
deletion_trigger = "when net's own write path can be handed a connection opened by a TLS-with-ALPN connect, at which point this leaf and net's writer are the same function"

[[leaf]]
module = "http2"
symbol = "__recv"
class = "host_abi_leaf"
abi = "read(2) / OpenSSL SSL_read(3) through stdlib/net's XrIOConn, suspending on the netpoll when the socket is not readable"
ownership = "fresh"
effect = "suspends"
provider = "the kernel and OpenSSL. VM stdlib/http2/http2_binding.c h2_recv performs one read of the source-selected bound and answers the bytes it got, which may be fewer than asked for. Empty means EOF and null means transport failure, so http2.xr owns both error mappings and all frame reassembly. No AOT provider exists"
deletion_trigger = "same as __send: when net's read path can serve a connection this module opened"

[[leaf]]
module = "http2"
symbol = "__close"
class = "host_abi_leaf"
abi = "close(2) plus OpenSSL SSL_shutdown(3) and SSL_CTX_free(3) through stdlib/net"
ownership = "none"
effect = "nothrow"
provider = "the kernel and OpenSSL. VM stdlib/http2/http2_binding.c h2_close releases the connection and returns its generation-checked slot to the per-isolate table. It returns Unit; resource policy is source-owned. No AOT provider exists"
deletion_trigger = "same as __send and __recv: when the connection is net's to close"

[[leaf]]
module = "http2"
symbol = "__supported"
class = "build_identity_leaf"
abi = "none; reports whether a TLS provider was linked into this build"
ownership = "none"
effect = "nothrow"
provider = "build configuration. The VM answers xr_tls_is_available() from src/io/xtls_provider.c, which is a constant true or false chosen by XR_ENABLE_TLS -- it probes nothing at runtime, so a true answer means OpenSSL is linked, not that any peer will negotiate h2. AOT src/aot/xrt_http.h xrt_http_h2_supported returns false unconditionally, which is why an AOT build has no HTTP/2 at all"
deletion_trigger = "when http2.xr reads the TLS provider's presence through net.__hasTLS instead of a second leaf asking the same question, which needs the multi-module program authority tracked in blockers/a-stdlib-multi-module-program-authority.md; the leaf disappears entirely once every supported build links a TLS provider"

# ============================================================================
# io -- filesystem and standard streams
# ============================================================================
#
# Two facts govern this module. First, a handle is a file descriptor. It used
# to be a `FILE*` cast to i64, which meant an arbitrary integer written in
# `.xr` source could be dereferenced; a descriptor is validated by the kernel
# and answers EBADF instead, and it is the only handle form io_uring accepts.
# 0, 1 and 2 are reserved for the standard streams, and reads on 0 and writes
# on 1 and 2 go through the C runtime's own stdin/stdout/stderr so they stay
# ordered against print(), which writes the same FILE*. The write-side half of
# the triple requested in
# `blockers/a-stdlib-no-write-side-file-descriptor-leaf.md` now exists, so the
# drain loop, the no-progress-is-failure rule and the failed-close rule live in
# `io.xr` and `__appendFile`, `__copyFile`, `__writeFile`, `__writeFileBytes`,
# `__writeStdout` and `__writeStderr` are gone. Second, the VM and AOT halves
# of this module are two independent implementations that share only the pure
# loop helpers in `src/shared/xr_io_core.h`; where they reach different
# syscalls the provider field says so, because a leaf with two meanings cannot
# be reduced to one Xray body until they agree.

[[leaf]]
module = "io"
symbol = "__FileStat"
class = "native_record_shape_leaf"
abi = "none; a record layout, not a call"
ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def). VM materialises it via xr_stdlib_record_class_get(X, \"io\", \"__FileStat\") in stdlib/io/io.c; AOT ignores the class and builds an anonymous struct object in src/aot/xrt_io.h"
deletion_trigger = "when a .def entry can return a structural record declared by io.xr, so the ten stat fields can cross the host boundary without a native record class"

[[leaf]]
module = "io"
symbol = "__chdir"
class = "host_abi_leaf"
abi = "chdir(2); Win32 SetCurrentDirectory"
ownership = "none"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_chdir -> src/os/unix/fs_unix.c xr_fs_chdir; AOT src/aot/xrt_io.h calls chdir directly. Same syscall, two call paths"
deletion_trigger = "when Xray source can issue the chdir(2) call itself; the leaf is already the minimal form of this boundary, so nothing smaller has to exist first"

[[leaf]]
module = "io"
symbol = "__chmod"
class = "host_abi_leaf"
abi = "chmod(2); Win32 CRT _chmod"
ownership = "none"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_chmod; AOT src/aot/xrt_io.h xrt_io_chmod_value. Both range-check the mode through xr_io_core_chmod_mode() in src/shared/xr_io_core.h, which is a cast and a bounds test"
deletion_trigger = "when Xray source can issue the chmod(2) call itself; the leaf is already the minimal form of this boundary"

[[leaf]]
module = "io"
symbol = "__cwd"
class = "host_abi_leaf"
abi = "getcwd(3); Win32 CRT _getcwd"
ownership = "fresh"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_cwd -> src/os/unix/fs_unix.c xr_fs_getcwd; AOT src/aot/xrt_io.h calls getcwd directly into a stack buffer"
deletion_trigger = "when Xray source can issue the getcwd(3) call itself; the leaf is already the minimal form of this boundary"

[[leaf]]
module = "io"
symbol = "__fileClose"
class = "host_abi_leaf"
abi = "close(2); Win32 CRT _close"
ownership = "none"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_fileClose; AOT src/aot/xrt_io.h xrt_io_file_close. Both refuse handle <= 2, because 0, 1 and 2 are the reserved standard streams and closing one would cost the process its output"
deletion_trigger = "when a .def entry can declare an opaque handle type io.xr owns, so the descriptor stops travelling as a bare i64 that any arithmetic can produce; the syscall underneath is already the minimal form of this boundary"

[[leaf]]
module = "io"
symbol = "__fileFlush"
class = "host_abi_leaf"
abi = "fflush(3) on stdout or stderr, reaching write(2); no call at all for any other handle"
ownership = "none"
effect = "nothrow"
provider = "libc stdio. VM stdlib/io/io.c io_fileFlush; AOT src/aot/xrt_io.h xrt_io_file_flush. Only handles 1 and 2 reach a syscall: a plain descriptor carries no C-runtime buffering, so flushing one is a no-op that reports success"
deletion_trigger = "when writes to the standard streams no longer pass through C-runtime buffering -- that is, when nothing else in the process writes stdout through a FILE* and the ordering this leaf exists to preserve stops mattering. print() is the one that does today (src/runtime/value/xvalue_print.c on the VM, xrt_print on the AOT side)"

[[leaf]]
module = "io"
symbol = "__fileOpen"
class = "host_abi_leaf"
abi = "open(2) with O_RDONLY|O_CLOEXEC; Win32 CRT _open with _O_BINARY|_O_NOINHERIT"
ownership = "none"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_fileOpen; AOT src/aot/xrt_io.h xrt_io_file_open. The returned i64 is a file descriptor, so a bogus integer from Xray source answers EBADF rather than being dereferenced. A descriptor landing on 0, 1 or 2 is lifted above the reserved range with F_DUPFD_CLOEXEC, and a failed lift refuses the open"
deletion_trigger = "when a .def entry can declare an opaque handle type io.xr owns, so the descriptor stops travelling as a bare i64; the open(2) call itself is already the minimal form of this boundary"

[[leaf]]
module = "io"
symbol = "__fileOpenWrite"
class = "host_abi_leaf"
abi = "open(2) with O_WRONLY|O_CREAT|O_CLOEXEC plus O_APPEND or O_TRUNC; Win32 CRT _open with _O_BINARY|_O_NOINHERIT"
ownership = "none"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_fileOpenWrite; AOT src/aot/xrt_io.h xrt_io_file_open_write. The write-side half of the handle triple requested in blockers/a-stdlib-no-write-side-file-descriptor-leaf.md. Same descriptor discipline as io.__fileOpen, and the append flag is the whole of the difference between a truncating write and an appending one -- which is why io.xr needs no second entry point for it"
deletion_trigger = "same as io.__fileOpen: when a .def entry can declare an opaque handle type io.xr owns. The truncate-or-append choice is one open(2) flag and has no smaller form"

[[leaf]]
module = "io"
symbol = "__fileRead"
class = "host_abi_leaf"
abi = "read(2), retried on EINTR; fread(3) for handle 0. Win32 CRT _read"
ownership = "fresh"
effect = "nothrow"
provider = "kernel via libc. VM stdlib/io/io.c io_fileRead; AOT src/aot/xrt_io.h xrt_io_read_handle_chunk. One read into a freshly allocated byte array, no drain loop; a zero-length result is EOF. Handle 0 is read through the C runtime's stdin stream on both sides. io.xr owns whole-file and whole-stdin aggregation, the 2 GiB ceiling and UTF-8 validation"
deletion_trigger = "same as io.__fileOpen: when a .def entry can declare an opaque handle type io.xr owns. The chunked-read shape itself is already what io.xr's BufReader is built on and does not need to change"

[[leaf]]
module = "io"
symbol = "__fileWrite"
class = "host_abi_leaf"
abi = "write(2), retried on EINTR, or one io_uring WRITE submission on Linux; fwrite(3) for handles 1 and 2. Win32 CRT _write"
ownership = "none"
effect = "suspends"
provider = "kernel plus the Xray runtime's io_uring completion path on the VM (src/os/netpoll/netpoll_iouring.c); plain write(2) on the AOT side, which has no coroutine to park. One write, reporting what the stream accepted; the drain loop, the no-progress-is-failure rule and the failed-close rule are in stdlib/io/io.xr. The uring submission passes offset -1 so the descriptor's own file position advances, which is what lets an appending handle keep appending"
