ownership = "none"
effect = "nothrow"
provider = "declaration only (stdlib/defs/core.def, fields stdout/stderr/exitCode). It is the return type of os.__exec. VM instantiates it through xr_stdlib_record_class_get(X, \"os\", \"__ExecResult\"); AOT builds an anonymous struct object instead"
