symbol = "__monotonicNanos"
class = "host_abi_leaf"
abi = "clock_gettime(2) CLOCK_MONOTONIC; Win32 QueryPerformanceCounter"
ownership = "none"
effect = "nothrow"
provider = "kernel clock via libc, but through different paths: the VM calls src/coro/xworker.c xr_runtime_current_monotonic_ns, which returns the runtime's virtual tick under deterministic mode, while AOT calls src/aot/xrt_time.h xrt_platform_monotonic_ns and always reads the real clock. Deterministic mode therefore exists on the VM only"
deletion_trigger = "when deterministic mode is expressible on both backends -- until then the leaf is the only place the virtual clock can be substituted -- and Xray source can issue the clock_gettime(2) call itself"

