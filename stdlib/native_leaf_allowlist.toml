[[leaf]]
module = "net"
symbol = "__connectFd"
class = "host_abi_leaf"
abi = "socket(2), fcntl(2) F_SETFL, setsockopt(2) TCP_NODELAY, non-blocking connect(2), then getsockopt(2) SO_ERROR for the verdict; the io_uring path uses IORING_OP_CONNECT and reads the verdict from the completion instead"
