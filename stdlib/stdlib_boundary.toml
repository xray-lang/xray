private_native_reason = "Canonical Unicode property table queries"
perf_suite = "stdlib/regex"

[[module]]
name = "mem"
public = true
layer = "L1"
policy = "xray_semantic"
semantic_source = "stdlib/mem/mem.xr"
# Buffer's public class and methods are source-owned. The private storage handle
# is registered when the module loads because it carries the runtime destructor
# that the language intentionally does not expose as a user hook.
load_time_classes = ["__BufferStorage"]
# Layout, pointer and borrow intrinsics are declared by
# src/frontend/analyzer/xa_intrinsic_registry.def instead, because their result
# type comes from an explicit type argument and they lower to backend ops
# rather than to calls, so a .def row could only restate a signature nothing
# reads.
public_native = []
private_native_sources = ["stdlib/mem/mem.c"]
private_native_reason = "Private allocator, page, overlap-move and machine-intrinsic leaves consumed by mem.xr"
perf_suite = "stdlib/mem"

