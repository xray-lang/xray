# Generated VM-native entries use the canonical hosted object ABI above. New
# entries fail closed unless the generator supports their exact ABI batch and
# they provide source, old-C oracle, direct ABI gate, workload benchmark, diff
# coverage, and the global switch. ABI microbenchmarks deliberately do not use
# the process-level VM/AOT benchmark runner: that runner mostly measures process
# startup, while the ABI gate compares generated and legacy-C adapters directly.

[[vm_fastpath]]
symbol = "http.isRedirectStatus"
module = "http"
member = "isRedirectStatus"
reference = "stdlib/http/http.xr::isRedirectStatus"
native = "xr_generated_http_is_redirect_status"
abi = "i64->bool"
batch = "scalar"
reason = "Pure scalar protocol predicate; first generated-native ABI batch"
abi_gate = "test_stdlib_vm_fastpath_abi"
workload_benchmark = "http.head.contract"
diff_case = "tests/diff/cases/semantics/stdlib/http_redirect_status_direct.xr"
oracle = "src/shared/xr_http_url.c::is_redirect_status"
review_date = "2026-08-02"
disable_build_option = "XRAY_STDLIB_VM_FASTPATHS"

[[vm_fastpath]]
symbol = "ws.isValidCloseCode"
module = "ws"
member = "isValidCloseCode"
reference = "stdlib/ws/ws.xr::isValidCloseCode"
native = "xr_generated_ws_is_valid_close_code"
abi = "i64->bool"
batch = "scalar"
reason = "Pure scalar protocol predicate; first generated-native ABI batch"
abi_gate = "test_stdlib_vm_fastpath_abi"
workload_benchmark = "ws.protocol.contract"
diff_case = "tests/diff/cases/semantics/stdlib/ws_close_code_fastpath_direct.xr"
oracle = "tests/unit/stdlib/test_stdlib_vm_fastpath_abi.c::legacy_ws_valid_close_code"
review_date = "2026-08-02"
disable_build_option = "XRAY_STDLIB_VM_FASTPATHS"
