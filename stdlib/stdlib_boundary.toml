# Task 196: canonical standard-library ownership and backend-boundary policy.
# Signatures remain source-derived from .xr/.def/native type declarations.
schema = 1

[governance]
vm_fastpath_option = "XRAY_STDLIB_VM_FASTPATHS"
error_model = "enum_value_channel"
failure_as_data = "domain_adt"
forbidden_prelude_symbols = ["Result"]

[dynamic_audit]
# These modules still expose fixed-shape dynamic APIs and must be migrated
# by task 196 after the typed enum error-channel and 191/197 consumer prerequisites land.
migration_modules = [
  "Coro", "CoroPool", "cluster", "csv", "log", "net", "toml",
  "url", "ws", "xml", "yaml",
]
# Exact, reviewed dynamic boundaries live in the structured entries below.
# New entries require a source API and all ownership/domain metadata.

[[dynamic_allowlist]]
symbol = "Logger.child"
direction = "input"
domain = "explicit_bridge"
reason = "Structured logging fields intentionally accept arbitrary Json values"
owner = "stdlib/log"
review_task = "task-196"

