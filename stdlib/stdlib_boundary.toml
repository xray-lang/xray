# Generated VM-native entries use the canonical hosted object ABI above. New
# entries fail closed unless the generator supports their exact ABI batch and
# they provide source, old-C oracle, direct ABI gate, workload benchmark, diff
# coverage, and the global switch. ABI microbenchmarks deliberately do not use
# the process-level VM/AOT benchmark runner: that runner mostly measures process
# startup, while the ABI gate compares generated and legacy-C adapters directly.

