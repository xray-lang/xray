# Task 196: canonical standard-library ownership and backend-boundary policy.
# Signatures remain source-derived from .xr/.def/native type declarations.
schema = 1

[governance]
vm_fastpath_option = "XRAY_STDLIB_VM_FASTPATHS"
export_authority = "boundary_manifest_semantic_source"
l4_algorithm_review_task = "task-256"
l4_algorithm_reviewed = [
  "_probe", "base64", "csv", "datetime", "encoding", "path", "strconv",
  "sync", "text", "toml", "url", "xml", "yaml",
]
error_model = "enum_value_channel"
failure_as_data = "domain_adt"
forbidden_prelude_symbols = ["Result"]
regex_reassessment_triggers = [
  "generated_stdlib_vm_fastpaths_fully_landed",
  "freestanding_runtime_requires_regex_without_native_library",
]

[object_abi]
version = 1
value_layout = "include/xray_value_abi.h"
object_header = "src/shared/xr_obj_header.h"
entry_abi = "XrValue(XrHostedFragmentContext*,XrValue*,uint32_t;signal)"
error_channel = "vm_pending_error"
ownership = "borrow_args_owned_result"
unsupported_policy = "fail_closed"

[dynamic_audit]
# These modules still expose fixed-shape dynamic APIs and must be migrated
# by task 196 after the typed enum error-channel and 191/197 consumer prerequisites land.
migration_modules = [
  "Coro", "CoroPool", "csv", "log", "toml", "url", "xml", "yaml",
]
# Exact, reviewed dynamic boundaries live in the structured entries below.
# New entries require a source API and all ownership/domain metadata.

