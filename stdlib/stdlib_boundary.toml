# Task 196: canonical standard-library ownership and backend-boundary policy.
# Signatures remain source-derived from .xr/.def/native type declarations.
schema = 3

[governance]
vm_fastpath_option = "XRAY_STDLIB_VM_FASTPATHS"
export_authority = "boundary_manifest_semantic_source"
l4_algorithm_review_task = "task-256"
l4_algorithm_reviewed = [
  "_probe", "base64", "csv", "datetime", "encoding", "path",
  "sync", "text", "toml", "url", "xml", "yaml",
]
error_model = "enum_value_channel"
failure_as_data = "domain_adt"
forbidden_prelude_symbols = ["Result"]
regex_reassessment_triggers = [
  "generated_stdlib_vm_fastpaths_fully_landed",
  "freestanding_runtime_requires_regex_without_native_library",
]

[object_abi]
version = 1
value_layout = "include/xray_value_abi.h"
object_header = "src/shared/xr_obj_header.h"
entry_abi = "XrValue(XrHostedFragmentContext*,XrValue*,uint32_t;signal)"
error_channel = "vm_pending_error"
ownership = "borrow_args_owned_result"
unsupported_policy = "fail_closed"

# `log` owns mutable module state shared by its variadic source implementation.
# A hosted fragment has a separate generated-C module image, so exporting only
# the fixed-arity control functions would split one logical logger into two
# state stores. Keep the complete stateful surface on the canonical VM module
# until hosted fragments can bind directly to VM-owned module slots.
[[hosted_fragment_deferred]]
symbol = "log.enableAsync"
reason = "stateful-module-slot-identity"

[[hosted_fragment_deferred]]
symbol = "log.enableSource"
reason = "stateful-module-slot-identity"

[[hosted_fragment_deferred]]
symbol = "log.flush"
reason = "stateful-module-slot-identity"

[[hosted_fragment_deferred]]
symbol = "log.isEnabled"
reason = "stateful-module-slot-identity"

[[hosted_fragment_deferred]]
symbol = "log.setFormat"
reason = "stateful-module-slot-identity"

[[hosted_fragment_deferred]]
symbol = "log.setLevel"
reason = "stateful-module-slot-identity"

[dynamic_audit]
# These modules still expose fixed-shape dynamic APIs and must be migrated
# by task 196 after the typed enum error-channel and 191/197 consumer prerequisites land.
migration_modules = [
  "Coro", "CoroPool", "csv", "log", "toml", "url", "xml", "yaml",
]
# No dynamic boundary is allowed today: the log and HTTP surfaces that used to
# accepted values of any shape now carry exact types. An entry may only be added
# back for a symbol the source API still exposes dynamically, and it must carry
# complete ownership and domain metadata.

[[module]]
name = "time"
public = true
layer = "L1"
policy = "xray_semantic"
semantic_source = "stdlib/time/time.xr"
public_native = []
private_native_sources = ["stdlib/time/*.c"]
private_native_reason = "Host clock reads and the yieldable timer suspension consumed by time.xr"
perf_suite = "stdlib/time"

