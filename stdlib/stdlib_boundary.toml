[[module]]
name = "test_yield"
public = false
layer = "L0"
policy = "native_primitive"
semantic_source = "stdlib/test_yield/test_yield.c"
public_native = []
# This module has no Xray source to derive an export set from: every entry is a
# scheduler test stub whose point is the native binding kind it is bound with.
# Declaring the set here is what lets the generic loader carry it too.
native_fn_exports = [
  { name = "simple", vm = "test_yield_simple", vm_binding = "yieldable" },
  { name = "add", vm = "test_yield_add", vm_binding = "yieldable" },
  { name = "sync", vm = "test_yield_sync", vm_binding = "normal" },
  { name = "blocking_sleep", vm = "test_yield_blocking_sleep", vm_binding = "slow" },
  { name = "multi_yield", vm = "test_yield_multi", vm_binding = "yieldable" },
  { name = "chain", vm = "test_yield_chain", vm_binding = "yieldable" },
  { name = "error_test", vm = "test_yield_error", vm_binding = "yieldable" },
  { name = "cancel_test", vm = "test_yield_cancel", vm_binding = "yieldable" },
  { name = "nested", vm = "test_yield_nested", vm_binding = "yieldable" },
  { name = "long_task", vm = "test_yield_long_task", vm_binding = "yieldable" },
  { name = "counter_inc", vm = "test_yield_counter_inc", vm_binding = "yieldable" },
  { name = "counter_get", vm = "test_yield_counter_get", vm_binding = "normal" },
  { name = "counter_reset", vm = "test_yield_counter_reset", vm_binding = "normal" },
]
private_native_sources = ["stdlib/test_yield/*.c"]
private_native_reason = "Internal scheduler/yieldable test module"
perf_suite = "stdlib/test_yield"

